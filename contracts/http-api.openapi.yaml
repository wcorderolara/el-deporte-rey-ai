openapi: 3.1.0
info:
  title: El Deporte Rey GT content platform - local HTTP API
  version: 1.0.0
  description: |
    HTTP contract v1 of the local El Deporte Rey GT API, version 1.0.0 (contract ID http-api). Promoted by WI-1-T20
    from the proposal accepted by the Orchestrator (OD-23; 1.0.0-proposed.2 as designed in WI-1-T09 and WI-1-T11G and
    corrected for the security design reviews T10 and T11H), with the visual-QA warning check capitalized_tokens added
    by OD-26. The OpenAPI document is authoritative; packages/contracts mirrors it with Zod schemas and the contract
    tests check the parity (AD-04).
    Contract evolution (PD-11): within v1 only additive changes are allowed. A breaking change needs a new major path
    and a Product Owner decision. Every change follows the contract-change process with a Contract Safety assessment.
    Conventions (architecture-delta.md section 2.1):
    - Base path /api/v1; JSON bodies in camelCase; times ISO-8601 UTC strings.
    - Server-generated IDs are lowercase UUIDs (schema Uuid); catalogue, season, stage and template IDs are slugs
      (schema Slug); source IDs use schema SourceId. Every request string has a pattern or a maxLength. The server
      applies the same patterns before any file-system use, including IDs read back from the database (T10-F13).
    - Patterns are ECMA-262 regular expressions evaluated with the Unicode flag (\p{...} classes).
    - Provider neutrality (R-140, R-288): no schema, field or enum carries a provider-specific name, code or
      identifier. Provider references are opaque server-side values and never appear in this contract.
    - Errors use application/problem+json (schema Problem) with a stable machine-readable `code`; `detail` is built
      from fixed text and sanitized parameters only, never from provider bodies, exception messages, credentials or
      file paths.
    - Every request whose Host header is not in the configured exact host:port allow-list gets 421 MISDIRECTED_HOST
      (declared on every operation). Every method other than GET and HEAD must carry `X-EDR-Client: web`; a present
      Origin must be in the configured origin allow-list (`null` is refused); a request body requires
      `Content-Type: application/json` (brand upload: image/png or image/jpeg only); refusals are 403 FORBIDDEN_ORIGIN
      or 415 UNSUPPORTED_MEDIA_TYPE before the body is parsed. API requests whose Sec-Fetch-Site is cross-site or
      same-site are refused with 403 FORBIDDEN_ORIGIN (declared on every operation).
    - GET and HEAD operations have no persistent side effects. Catalogue GET operations may use the in-memory
      provider request budget and fill the in-memory projection cache; neither is persistent state.
    - No authentication: single local operator without login (PD-05). The server listens on 127.0.0.1 only.
    - No credential, provider base URL or provider token is ever part of a request or response.
    - There is no publication operation of any kind (BR-11, R-042, R-219).
    - No operation sets a fact to verified (R-412). The only status an operator action sets is manually_approved,
      on eligible MANUAL_DATA facts only, and it is never verification (PD-13, R-071).
    - Compatibility (PD-11): additive changes only within v1 (new optional request fields, new response fields,
      new operations, new error codes). Removing or changing the meaning of anything, or narrowing a request input,
      is a breaking change and needs a new major path and a Product Owner decision.
servers:
  - url: http://127.0.0.1:4300/api/v1
tags:
  - name: catalog
  - name: competitions
  - name: teams
  - name: projects
  - name: runs
  - name: facts
  - name: drafts
  - name: review
  - name: exports
  - name: imports
  - name: brand
  - name: templates
  - name: system
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      responses:
        '200':
          description: Server is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: ok }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /settings:
    get:
      tags: [system]
      operationId: getSettings
      description: Non-secret settings the UI needs (R-226). Never contains credentials, tokens or base URLs.
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /catalog/competitions:
    get:
      tags: [catalog]
      operationId: listCompetitions
      description: |
        Dynamic competition catalogue (R-073, R-243, R-282): the competitions of every enabled data source (LIVE_DATA
        discovery, MANUAL_DATA imports, DEMO_DATA fixtures), merged by the configured competition links, each with its
        data sources and their availability (R-075, R-286). Seasons and stages are not included; they are listed on
        selection (R-141). Uses at most one provider request per LIVE_DATA source, from the cache when valid; when the
        request budget is exhausted the last cached listing is returned with its retrieval time (R-291).
      responses:
        '200':
          description: Catalogue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalogue' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /catalog/competitions/{competitionId}/sources/{sourceId}/seasons:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
      - $ref: '#/components/parameters/SourceIdParam'
    get:
      tags: [catalog]
      operationId: listSeasons
      description: |
        Seasons that the chosen data source reports for the competition (R-074, R-243, R-244). A competition or season
        that the source refuses (for example a subscription restriction) is returned with availability false and a
        reason (R-286). 503 PROVIDER_RATE_LIMITED (with retryAfterSeconds) when the request budget is exhausted and no
        cached listing exists (R-291). A competitionId or sourceId that is not in the current catalogue listing, or a
        seasonId that is not in the source's seasons listing, answers 404 without any provider request for that ID
        (T11H-F06).
      responses:
        '200':
          description: Seasons.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /catalog/competitions/{competitionId}/sources/{sourceId}/seasons/{seasonId}/stages:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
      - $ref: '#/components/parameters/SourceIdParam'
      - $ref: '#/components/parameters/SeasonId'
    get:
      tags: [catalog]
      operationId: listStages
      description: |
        Stages of the season, by the names the source gives them, each with its matchday numbers when the source
        numbers them, and whether standings are expected (R-074, R-077, R-283, R-284). Different tournament
        structures use the same shape. Same budget, cache and availability rules as listSeasons.
      responses:
        '200':
          description: Stages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /competitions:
    get:
      tags: [competitions]
      operationId: listManagedCompetitions
      description: List locally managed competitions, newest first. This is distinct from the provider catalogue.
      responses:
        '200':
          description: Locally managed competitions.
          content:
            application/json:
              schema:
                type: object
                required: [competitions]
                additionalProperties: false
                properties:
                  competitions:
                    type: array
                    items: { $ref: '#/components/schemas/Competition' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    post:
      tags: [competitions]
      operationId: createCompetition
      description: Create a locally managed competition. This does not create a project or query a sports provider.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { $ref: '#/components/schemas/DisplayName' }
      responses:
        '201':
          description: Competition created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Competition' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [competitions]
      operationId: getCompetition
      responses:
        '200':
          description: Locally managed competition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Competition' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/seasons:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [competitions]
      operationId: listManagedSeasons
      description: List locally managed seasons of a competition, newest first. No provider request is made.
      responses:
        '200':
          description: Competition seasons.
          content:
            application/json:
              schema:
                type: object
                required: [seasons]
                additionalProperties: false
                properties:
                  seasons:
                    type: array
                    items: { $ref: '#/components/schemas/ManagedSeason' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    post:
      tags: [competitions]
      operationId: createManagedSeason
      description: Add a historical/current season label without replacing another season of the competition.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              additionalProperties: false
              properties:
                label: { $ref: '#/components/schemas/DisplayName' }
      responses:
        '201':
          description: Season created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedSeason' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/seasons/{seasonId}:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: seasonId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [competitions]
      operationId: getManagedSeason
      responses:
        '200':
          description: Competition season.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedSeason' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [competitions]
      operationId: updateManagedSeason
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              additionalProperties: false
              properties:
                label: { $ref: '#/components/schemas/DisplayName' }
      responses:
        '200': { description: Updated season., content: { application/json: { schema: { $ref: '#/components/schemas/ManagedSeason' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/seasons/{seasonId}/stages:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: seasonId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [competitions]
      operationId: listCompetitionStages
      description: List optional phases of a managed season. A season with no stages remains valid.
      responses:
        '200':
          description: Season phases in presentation order.
          content:
            application/json:
              schema: { type: object, required: [stages], additionalProperties: false, properties: { stages: { type: array, items: { $ref: '#/components/schemas/CompetitionStage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    post:
      tags: [competitions]
      operationId: createCompetitionStage
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { $ref: '#/components/schemas/DisplayName' }
                displayOrder: { type: integer, minimum: 0 }
      responses:
        '201': { description: Phase created., content: { application/json: { schema: { $ref: '#/components/schemas/CompetitionStage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/seasons/{seasonId}/stages/{stageId}:
    parameters:
      - { name: competitionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: seasonId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: stageId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [competitions]
      operationId: getCompetitionStage
      responses:
        '200': { description: Phase., content: { application/json: { schema: { $ref: '#/components/schemas/CompetitionStage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [competitions]
      operationId: updateCompetitionStage
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { $ref: '#/components/schemas/DisplayName' }
      responses:
        '200': { description: Updated phase name., content: { application/json: { schema: { $ref: '#/components/schemas/CompetitionStage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/seasons/{seasonId}/rounds:
    parameters:
      - { name: competitionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: seasonId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [competitions]
      operationId: listSeasonRounds
      description: List jornadas or rounds organized directly within a season, without a phase.
      responses:
        '200':
          description: Direct season rounds.
          content:
            application/json:
              schema:
                type: object
                required: [rounds]
                additionalProperties: false
                properties:
                  rounds:
                    type: array
                    items: { $ref: '#/components/schemas/CompetitionRound' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    post:
      tags: [competitions]
      operationId: createSeasonRound
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { $ref: '#/components/schemas/DisplayName' }
                displayOrder: { type: integer, minimum: 0 }
      responses:
        '201': { description: Round created directly under the season., content: { application/json: { schema: { $ref: '#/components/schemas/CompetitionRound' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/seasons/{seasonId}/rounds/{roundId}:
    parameters:
      - { name: competitionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: seasonId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: roundId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [competitions]
      operationId: getSeasonRound
      responses:
        '200': { description: Round in the season., content: { application/json: { schema: { $ref: '#/components/schemas/CompetitionRound' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [competitions]
      operationId: updateCompetitionRound
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { $ref: '#/components/schemas/DisplayName' }
                stageId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
      responses:
        '200': { description: Updated round name., content: { application/json: { schema: { $ref: '#/components/schemas/CompetitionRound' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [competitions]
      operationId: deleteCompetitionRound
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      responses:
        '204': { description: Round removed when it has no matches or result history. }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/seasons/{seasonId}/stages/{stageId}/rounds:
    parameters:
      - { name: competitionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: seasonId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: stageId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [competitions]
      operationId: listStageRounds
      responses:
        '200':
          description: Rounds in the phase.
          content:
            application/json:
              schema:
                type: object
                required: [rounds]
                additionalProperties: false
                properties:
                  rounds:
                    type: array
                    items: { $ref: '#/components/schemas/CompetitionRound' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    post:
      tags: [competitions]
      operationId: createStageRound
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { $ref: '#/components/schemas/DisplayName' }
                displayOrder: { type: integer, minimum: 0 }
      responses:
        '201': { description: Round created in a phase., content: { application/json: { schema: { $ref: '#/components/schemas/CompetitionRound' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/seasons/{seasonId}/matches:
    parameters:
      - { name: competitionId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      - { name: seasonId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [competitions]
      operationId: listCompetitionMatches
      responses:
        '200':
          description: Season matches in calendar order.
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                additionalProperties: false
                properties:
                  matches:
                    type: array
                    items: { $ref: '#/components/schemas/CompetitionMatch' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    post:
      tags: [competitions]
      operationId: createCompetitionMatch
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [homeTeamId, awayTeamId]
              additionalProperties: false
              properties:
                homeTeamId: { $ref: '#/components/schemas/Uuid' }
                awayTeamId: { $ref: '#/components/schemas/Uuid' }
                kickoffAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
                stageId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
                roundId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
