    get:
      tags: [imports]
      operationId: listImports
      description: Applied MANUAL_DATA imports, newest first (R-067, R-277). Rejected imports are not stored (R-066).
      responses:
        '200':
          description: Imports.
          content:
            application/json:
              schema:
                type: object
