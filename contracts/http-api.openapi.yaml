openapi: 3.1.0
info:
  title: El Deporte Rey GT content platform - local HTTP API
  version: 1.0.0
  description: |
    HTTP contract v1 of the local El Deporte Rey GT API, version 1.0.0 (contract ID http-api). Promoted by WI-1-T20
    from the proposal accepted by the Orchestrator (OD-23; 1.0.0-proposed.2 as designed in WI-1-T09 and WI-1-T11G and
    corrected for the security design reviews T10 and T11H), with the visual-QA warning check capitalized_tokens added
    by OD-26. The OpenAPI document is authoritative; packages/contracts mirrors it with Zod schemas and the contract
    tests check the parity (AD-04).
    Contract evolution (PD-11): within v1 only additive changes are allowed. A breaking change needs a new major path
    and a Product Owner decision. Every change follows the contract-change process with a Contract Safety assessment.
    Conventions (architecture-delta.md section 2.1):
    - Base path /api/v1; JSON bodies in camelCase; times ISO-8601 UTC strings.
    - Server-generated IDs are lowercase UUIDs (schema Uuid); catalogue, season, stage and template IDs are slugs
      (schema Slug); source IDs use schema SourceId. Every request string has a pattern or a maxLength. The server
      applies the same patterns before any file-system use, including IDs read back from the database (T10-F13).
    - Patterns are ECMA-262 regular expressions evaluated with the Unicode flag (\p{...} classes).
    - Provider neutrality (R-140, R-288): no schema, field or enum carries a provider-specific name, code or
      identifier. Provider references are opaque server-side values and never appear in this contract.
    - Errors use application/problem+json (schema Problem) with a stable machine-readable `code`; `detail` is built
      from fixed text and sanitized parameters only, never from provider bodies, exception messages, credentials or
      file paths.
    - Every request whose Host header is not in the configured exact host:port allow-list gets 421 MISDIRECTED_HOST
      (declared on every operation). Every method other than GET and HEAD must carry `X-EDR-Client: web`; a present
      Origin must be in the configured origin allow-list (`null` is refused); a request body requires
      `Content-Type: application/json` (brand upload: image/png or image/jpeg only); refusals are 403 FORBIDDEN_ORIGIN
      or 415 UNSUPPORTED_MEDIA_TYPE before the body is parsed. API requests whose Sec-Fetch-Site is cross-site or
      same-site are refused with 403 FORBIDDEN_ORIGIN (declared on every operation).
    - GET and HEAD operations have no persistent side effects. Catalogue GET operations may use the in-memory
      provider request budget and fill the in-memory projection cache; neither is persistent state.
    - No authentication: single local operator without login (PD-05). The server listens on 127.0.0.1 only.
    - No credential, provider base URL or provider token is ever part of a request or response.
    - There is no publication operation of any kind (BR-11, R-042, R-219).
    - No operation sets a fact to verified (R-412). The only status an operator action sets is manually_approved,
      on eligible MANUAL_DATA facts only, and it is never verification (PD-13, R-071).
    - Compatibility (PD-11): additive changes only within v1 (new optional request fields, new response fields,
      new operations, new error codes). Removing or changing the meaning of anything, or narrowing a request input,
      is a breaking change and needs a new major path and a Product Owner decision.
servers:
  - url: http://127.0.0.1:4300/api/v1
tags:
  - name: catalog
  - name: competitions
  - name: teams
  - name: projects
  - name: runs
  - name: facts
  - name: drafts
  - name: review
  - name: exports
  - name: imports
  - name: brand
  - name: templates
  - name: design
  - name: visual-templates
  - name: system
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      responses:
        '200':
          description: Server is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: ok }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /settings:
    get:
      tags: [system]
      operationId: getSettings
      description: Non-secret settings the UI needs (R-226). Never contains credentials, tokens or base URLs.
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /catalog/competitions:
    get:
      tags: [catalog]
      operationId: listCompetitions
      description: |
        Dynamic competition catalogue (R-073, R-243, R-282): the competitions of every enabled data source (LIVE_DATA
        discovery, MANUAL_DATA imports, DEMO_DATA fixtures), merged by the configured competition links, each with its
        data sources and their availability (R-075, R-286). Seasons and stages are not included; they are listed on
        selection (R-141). Uses at most one provider request per LIVE_DATA source, from the cache when valid; when the
        request budget is exhausted the last cached listing is returned with its retrieval time (R-291).
      responses:
        '200':
          description: Catalogue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalogue' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /catalog/competitions/{competitionId}/sources/{sourceId}/seasons:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
      - $ref: '#/components/parameters/SourceIdParam'
    get:
      tags: [catalog]
      operationId: listSeasons
      description: |
        Seasons that the chosen data source reports for the competition (R-074, R-243, R-244). A competition or season
        that the source refuses (for example a subscription restriction) is returned with availability false and a
        reason (R-286). 503 PROVIDER_RATE_LIMITED (with retryAfterSeconds) when the request budget is exhausted and no
        cached listing exists (R-291). A competitionId or sourceId that is not in the current catalogue listing, or a
        seasonId that is not in the source's seasons listing, answers 404 without any provider request for that ID
        (T11H-F06).
      responses:
        '200':
          description: Seasons.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /catalog/competitions/{competitionId}/sources/{sourceId}/seasons/{seasonId}/stages:
    parameters:
      - $ref: '#/components/parameters/CompetitionId'
      - $ref: '#/components/parameters/SourceIdParam'
      - $ref: '#/components/parameters/SeasonId'
    get:
      tags: [catalog]
      operationId: listStages
      description: |
        Stages of the season, by the names the source gives them, each with its matchday numbers when the source
        numbers them, and whether standings are expected (R-074, R-077, R-283, R-284). Different tournament
        structures use the same shape. Same budget, cache and availability rules as listSeasons.
      responses:
        '200':
          description: Stages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageList' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /competitions:
    get:
      tags: [competitions]
      operationId: listManagedCompetitions
      description: List locally managed competitions, newest first. This is distinct from the provider catalogue.
      responses:
        '200':
          description: Locally managed competitions.
          content:
            application/json:
              schema:
                type: object
                required: [competitions]
                additionalProperties: false
                properties:
                  competitions:
                    type: array
                    items: { $ref: '#/components/schemas/Competition' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    post:
      tags: [competitions]
      operationId: createCompetition
      description: Create a locally managed competition. This does not create a project or query a sports provider.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { $ref: '#/components/schemas/DisplayName' }
      responses:
        '201':
          description: Competition created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Competition' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /sports/providers:
    get:
      tags: [competitions]
      operationId: listSportsProviders
      description: List enabled live sports providers and adapter-level capabilities. Credentials and source configuration are never returned.
      responses:
        '200':
          description: Available providers.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                additionalProperties: false
                properties:
                  providers: { type: array, items: { $ref: '#/components/schemas/SportsProvider' } }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /sports/providers/{providerKey}/competitions:
    parameters:
      - name: providerKey
        in: path
        required: true
        schema: { $ref: '#/components/schemas/SourceId' }
    get:
      tags: [competitions]
      operationId: listExternalCompetitions
      description: Query and normalize a provider competition catalogue through its registered adapter.
      responses:
        '200':
          description: Normalized external competitions.
          content:
            application/json:
              schema:
                type: object
                required: [competitions]
                additionalProperties: false
                properties:
                  competitions: { type: array, items: { $ref: '#/components/schemas/ExternalCompetition' } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/provider-binding:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [competitions]
      operationId: getCompetitionProviderBinding
      responses:
        '200':
          description: Current provider binding, or null for a manual competition.
          content:
            application/json:
              schema:
                type: object
                required: [binding]
                additionalProperties: false
                properties:
                  binding: { anyOf: [{ $ref: '#/components/schemas/CompetitionProviderBinding' }, { type: 'null' }] }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    post:
      tags: [competitions]
      operationId: setCompetitionProviderBinding
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerKey, externalCompetitionId, mode]
              additionalProperties: false
              properties:
                providerKey: { $ref: '#/components/schemas/SourceId' }
                externalCompetitionId: { type: string, minLength: 1, maxLength: 120 }
                mode: { type: string, enum: [provider, hybrid] }
                replaceExisting: { type: boolean }
      responses:
        '201':
          description: Provider binding created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionProviderBindingResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [competitions]
      operationId: removeCompetitionProviderBinding
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      description: Mark the current binding unlinked while preserving all local sports data and binding history.
      responses:
        '204': { description: Binding removed; local data is preserved. }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/provider-binding/seasons:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [competitions]
      operationId: listCompetitionExternalSeasons
      description: List external seasons for the active competition binding. Season-name matches are candidates only and are never linked automatically.
      responses:
        '200': { description: External seasons., content: { application/json: { schema: { $ref: '#/components/schemas/ExternalSeasonListResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/provider-binding/seasons/{externalSeasonId}/capabilities:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: externalSeasonId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ExternalSeasonId' }
    get:
      tags: [competitions]
      operationId: getCompetitionImportCapabilities
      description: Query provider availability for data resources in one selected external season.
      responses:
        '200': { description: Supported and unavailable resources., content: { application/json: { schema: { $ref: '#/components/schemas/ImportCapabilitiesResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/import-operations:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [competitions]
      operationId: startCompetitionImportOperation
      description: Accept explicit preview work and return immediately with a durable operation identifier.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportPreviewRequest' }
      responses:
        '202': { description: Preview work accepted or equivalent operation reused., content: { application/json: { schema: { $ref: '#/components/schemas/ImportOperationStartResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/import-operations/{operationId}:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: operationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [competitions]
      operationId: getCompetitionImportOperation
      responses:
        '200': { description: Persisted operation state., content: { application/json: { schema: { $ref: '#/components/schemas/ImportOperationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/import-operations/{operationId}/cancel:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: operationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [competitions]
      operationId: cancelCompetitionImportOperation
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '200': { description: Cancellation requested or terminal state returned., content: { application/json: { schema: { $ref: '#/components/schemas/ImportOperationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/import-operations/{operationId}/events:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: operationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [competitions]
      operationId: streamCompetitionImportOperation
      description: SSE notifications with resumable sequence IDs. SQLite remains authoritative.
      responses:
        '200': { description: Server-sent progress events., content: { text/event-stream: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/import-previews:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [competitions]
      operationId: createCompetitionImportPreview
      description: Explicitly query and persist a temporary normalized, read-only snapshot. Does not apply imported data to local sports entities.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportPreviewRequest' }
      responses:
        '201': { description: Temporary import preview., content: { application/json: { schema: { $ref: '#/components/schemas/ImportPreviewResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/import-previews/{previewId}:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: previewId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [competitions]
      operationId: getCompetitionImportPreview
      description: Reopen the same cached snapshot without contacting the provider; reports expiry or relevant local staleness.
      responses:
        '200': { description: Existing preview snapshot., content: { application/json: { schema: { $ref: '#/components/schemas/ImportPreviewResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/import-previews/{previewId}/application-plan:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: previewId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [competitions]
      operationId: planCompetitionImportApplication
      description: Read-only dry run of a confirmed import from the stored snapshot. Returns what would be created, updated, kept or skipped, the explicit decisions still required and the plan hash to confirm. Never contacts the provider and writes no sports data.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportApplyPlanRequest' }
      responses:
        '200': { description: Current application plan., content: { application/json: { schema: { $ref: '#/components/schemas/ImportApplyPlanResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/import-previews/{previewId}/applications:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: previewId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [competitions]
      operationId: startCompetitionImportApplication
      description: Explicitly confirm a reviewed plan and start its durable application. The backend re-validates expiry, snapshot hash, binding, local fingerprint, decisions and the confirmed plan hash, then applies the season in one SQLite transaction. Repeating the request for the same snapshot returns the same operation. Never contacts the provider.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportApplyStartRequest' }
      responses:
        '202': { description: 'Queued, running or already completed application.', content: { application/json: { schema: { $ref: '#/components/schemas/ImportApplyOperationStartResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/import-applications/{operationId}:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: operationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      tags: [competitions]
      operationId: getCompetitionImportApplication
      description: Status of a confirmed application and, once completed, its persisted result. Survives preview expiry.
      responses:
        '200': { description: Application operation., content: { application/json: { schema: { $ref: '#/components/schemas/ImportApplyOperationResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /competitions/{competitionId}/import-applications/{operationId}/cancel:
    parameters:
      - name: competitionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: operationId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      tags: [competitions]
      operationId: cancelCompetitionImportApplication
