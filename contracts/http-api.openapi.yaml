  /imports:
    get:
      tags: [imports]
      operationId: listImports
      description: Applied MANUAL_DATA imports, newest first (R-067, R-277). Rejected imports are not stored (R-066).
      responses:
        '200':
          description: Imports.
          content:
            application/json:
              schema:
                type: object
                required: [imports]
                additionalProperties: false
                properties:
                  imports:
                    type: array
                    items: { $ref: '#/components/schemas/ImportSummary' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    post:
      tags: [imports]
      operationId: createImport
      description: |
        Import MANUAL_DATA from a JSON file, a CSV file (the exact file bytes sent base64-encoded in contentBase64
        inside the JSON body) or web-form entry (R-057, R-060 to R-069, R-119). Every channel is converted to one
        ManualImportDocument and validated by the same schema. The import is applied as a whole: any invalid record
        rejects it, with every error reported together (IMPORT_REJECTED with importErrors; R-273, R-274); nothing of
        a rejected import is stored. Duplicate matches are refused (R-275); person-level fields are refused naming the
        field (R-280); finished matches need a score and nothing is derived (R-279). Each selection in an applied
        import becomes a new version; earlier versions stay retrievable (R-278).
        File channels: the server decodes contentBase64 strictly (invalid base64 is encoding_invalid), checks at most
        512 KiB of decoded bytes (too_large), decodes the bytes as UTF-8 with invalid sequences refused
        (encoding_invalid; a leading byte-order mark is ignored for parsing only), and preserves exactly the received
        bytes as the original; originalSha256 is the SHA-256 of those bytes, so it equals the hash of the operator's
        file (R-277, T11H-F01). Form channel: the original is the submitted document serialized once as canonical
        UTF-8 JSON, at most 512 KiB (too_large), checked before anything is written. Error messages and fields never
        contain imported values (T11H-F12). Route body limit 1.5 MiB.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCreate' }
      responses:
        '201':
          description: Import applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [imports]
      operationId: getImport
      description: Import record with channel, file name, declared source, receipt time, original hash and the selection versions it created (R-067, R-277).
      responses:
        '200':
          description: Import.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /imports/{importId}/original:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [imports]
      operationId: getImportOriginal
      description: |
        The original imported content, unchanged (same SHA-256, R-277). Served as an attachment with
        `Content-Type: application/octet-stream`, `nosniff`, `Content-Security-Policy: default-src 'none'; sandbox`
        and `Cross-Origin-Resource-Policy: same-origin`. The `Content-Disposition` file name is generated by the
        server in ASCII, never taken from the stored file name: `original-<importId>.json`, `original-<importId>.csv`
        or `original-<importId>.form.json` (T11H-F11).
      responses:
        '200':
          description: The original content.
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /manual-data/selections:
    get:
      tags: [imports]
      operationId: listManualSelections
      description: Version history of every MANUAL_DATA selection of a competition season (R-068, R-278).
      parameters:
        - name: competitionId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Slug' }
        - name: seasonId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Slug' }
      responses:
        '200':
          description: Selections with their versions.
          content:
