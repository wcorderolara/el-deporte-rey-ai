    parameters:
      - $ref: '#/components/parameters/ManualVersionId'
    get:
      tags: [imports]
      operationId: getManualVersion
      description: One version of a MANUAL_DATA selection in its normalized form, current or superseded (R-068, R-278).
      responses:
        '200':
          description: Version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /brand/assets:
    get:
      tags: [brand]
      operationId: listBrandAssets
      responses:
        '200':
          description: Registered brand assets (R-033, R-228).
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                additionalProperties: false
                properties:
                  assets:
                    type: array
                    items: { $ref: '#/components/schemas/BrandAsset' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    post:
      tags: [brand]
      operationId: registerBrandAsset
      description: |
        Register an authorized El Deporte Rey GT brand asset (R-309, PD-ARCH-01G-A). The body is the raw image (PNG or
        JPEG for every category; WebP only for style references; at most 5 MiB and 4096 x 4096 pixels). SVG and fonts
        are refused. The declared Content-Type must match the detected file signature (415 otherwise); dimensions are
        read from the header before any decode; PNG and JPEG are decoded once with the renderer's decoder and WebP is
        checked by its container structure. Without usagePolicy the category default applies (logos and mascot
        protected, style references reference_only, others reusable); transformable is never a default. A file equal
        to a deleted asset restores that asset with the new metadata. Club badges and competition marks cannot be
        registered (PD-03, R-049, R-050).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - name: kind
          in: query
          required: true
          schema: { $ref: '#/components/schemas/BrandAssetKind' }
        - name: label
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Label' }
        - name: description
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 500, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }
        - name: usagePolicy
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BrandAssetUsagePolicy' }
        - name: official
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
        - name: variant
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Label' }
        - name: pose
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Label' }
        - name: expression
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Label' }
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, contentMediaType: image/png }
          image/jpeg:
            schema: { type: string, contentMediaType: image/jpeg }
          image/webp:
            schema: { type: string, contentMediaType: image/webp }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandAsset' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /brand/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [brand]
      operationId: getBrandAsset
      description: An asset with its usage (rendered slide versions, their projects and exports; PD-ARCH-01G-A).
      responses:
        '200':
          description: The asset and its usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandAssetDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [brand]
      operationId: updateBrandAsset
      description: |
        Edit the metadata, AI usage policy, official and primary marks or the active state of an asset (PD-ARCH-01G-A).
        At least one field is required. The stored file never changes. A style reference stays reference_only; pose
        and expression apply to the mascot only; the primary mark applies to an active logo or mascot whose policy is
        not reference_only and moves from the previous primary of its kind; deactivating the primary clears the mark.
        A deactivated asset is left out of later renders.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                active: { type: boolean }
                label: { $ref: '#/components/schemas/Label' }
                description: { oneOf: [{ type: string, minLength: 1, maxLength: 500, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
                usagePolicy: { $ref: '#/components/schemas/BrandAssetUsagePolicy' }
                official: { type: boolean }
                primary: { type: boolean }
                variant: { oneOf: [{ $ref: '#/components/schemas/Label' }, { type: 'null' }] }
                pose: { oneOf: [{ $ref: '#/components/schemas/Label' }, { type: 'null' }] }
                expression: { oneOf: [{ $ref: '#/components/schemas/Label' }, { type: 'null' }] }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandAsset' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [brand]
      operationId: deleteBrandAsset
      description: >-
        Delete an asset that no rendered slide version uses (PD-ARCH-01G-A). The deletion is logical (OD-08 keeps every
        row and the file is preserved): the asset leaves the library and later renders. An asset in use is refused with
        ASSET_IN_USE (409) naming its usage; it can be deactivated instead. Deleting a deleted asset answers 204 again.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204': { description: Asset deleted (or already deleted). }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /brand/assets/{assetId}/file:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [brand]
      operationId: getBrandAssetFile
      description: |
        Served with the stored MIME type, `nosniff`, `Content-Security-Policy: default-src 'none'; sandbox` and `Cross-Origin-Resource-Policy: same-origin`.
      responses:
        '200':
          description: The registered file.
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /brand/identity:
    get:
      tags: [brand]
      operationId: getBrandIdentity
      description: |
        The brand identity (PD-ARCH-01G-A): name, handle, mascot name, palette and fonts as the renderer uses them
        (configuration, read only), with the operator's description, graphic preferences and usage notes.
      responses:
        '200':
          description: The identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandIdentity' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [brand]
      operationId: updateBrandIdentity
      description: |
        Edit the descriptive fields of the identity. The name, handle, palette and fonts are the renderer's
        configuration and are not edited here; null clears a field or a usage note.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                description: { oneOf: [{ type: string, minLength: 1, maxLength: 1000, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
                graphicPreferences: { oneOf: [{ type: string, minLength: 1, maxLength: 2000, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
                colorUsage:
                  type: object
                  additionalProperties: false
                  properties:
                    primary: { oneOf: [{ type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
                    primaryDark: { oneOf: [{ type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
                    accent: { oneOf: [{ type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
                    secondary: { oneOf: [{ type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
                    light: { oneOf: [{ type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
                typographyUsage:
                  type: object
                  additionalProperties: false
                  properties:
                    heading: { oneOf: [{ type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
                    body: { oneOf: [{ type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
                    numeric: { oneOf: [{ type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandIdentity' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /templates:
    get:
      tags: [templates]
      operationId: listTemplates
      description: Carousel templates with versions and badge slots (R-031, R-050).
      responses:
        '200':
          description: Templates.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                additionalProperties: false
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /templates/{templateId}/preview:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
      - name: language
        in: query
        required: false
        schema: { $ref: '#/components/schemas/Language' }
    get:
      tags: [templates]
      operationId: previewTemplate
      description: |
        PNG preview rendered from built-in synthetic sample data, with the current brand settings and assets.
        Cached by template version, active brand-asset hashes and language (bounded work per request, T10-F04).
      responses:
        '200':
          description: Preview.
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /design/capabilities:
    get:
      tags: [design]
      operationId: getDesignCapabilities
      description: |
        What the configured image provider offers for AI design proposals (PD-ARCH-01G-B): its status (the API key is
        checked for presence on the server, never returned), the configured models with their qualities, size rules and
        published prices, the content types and formats, the roles each usage policy allows, and the usage limits with
        the images used today and the computed spend of the month. No request is sent to the provider.
      responses:
        '200':
          description: The capabilities.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignCapabilities' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /design/capabilities/check:
    post:
      tags: [design]
      operationId: checkDesignModelAccess
      description: |
        Ask the provider whether the account can use a configured model, with its free model metadata request. No image
        is generated and nothing is charged.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              additionalProperties: false
              properties:
                model: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9._-]{0,99}$' }
      responses:
        '200':
          description: The access of the account to the model.
          content:
            application/json:
              schema:
                type: object
                required: [model, access, errorCode]
                additionalProperties: false
                properties:
                  model: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9._-]{0,99}$' }
                  access: { type: string, enum: [available, unavailable, not_authorized, missing_api_key, disabled, error] }
                  errorCode: { oneOf: [{ $ref: '#/components/schemas/DesignGenerationErrorCode' }, { type: 'null' }] }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /design/estimates:
    post:
      tags: [design]
      operationId: estimateDesignGeneration
      description: |
        Check a generation request and show its scope before it is confirmed: the model, quality and count, the request
        and output sizes and the local adaptation, each brand asset with its role and whether its image would be sent,
        the effective prompt, the cost estimate (only from a published per-image cost; never a final cost) and the
        usage limits. A selected asset that is inactive, deleted or not allowed in its role by its usage policy is
        refused. Nothing is stored and nothing is sent to the provider.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignGenerationInput' }
      responses:
        '200':
          description: The scope and estimate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignEstimate' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /design/generations:
    post:
      tags: [design]
      operationId: createDesignGeneration
      description: |
        Start a confirmed generation (`confirmCost: true`). It may be charged by the provider. A repeated request key
        returns the same generation; the same key with another request is `REQUEST_KEY_REUSED`. The count, the daily
        images, the computed monthly spend and the concurrent generations are limited (`GENERATION_LIMIT_REACHED`).
        The generation runs asynchronously, one provider request per image, never retried automatically.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignGenerationCreate' }
      responses:
        '202':
          description: The generation was accepted (or the stored generation of a repeated request key).
          content:
            application/json:
              schema:
                type: object
                required: [generation, statusUrl, eventsUrl]
                additionalProperties: false
                properties:
                  generation: { $ref: '#/components/schemas/DesignGeneration' }
                  statusUrl: { type: string, maxLength: 200, pattern: '^/api/v1/design/generations/' }
                  eventsUrl: { type: string, maxLength: 200, pattern: '^/api/v1/design/generations/' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /design/generations/{generationId}:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
    get:
      tags: [design]
      operationId: getDesignGeneration
      description: The status the server recorded for a generation, with its saved proposals.
      responses:
        '200':
          description: The generation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignGeneration' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /design/generations/{generationId}/events:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
    get:
      tags: [design]
      operationId: streamDesignGenerationEvents
      description: SSE notifications of the recorded generation statuses with resumable sequence IDs. SQLite remains authoritative.
      responses:
        '200': { description: Server-sent progress events., content: { text/event-stream: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /design/proposals:
    get:
      tags: [design]
      operationId: listDesignProposals
      description: Every generated proposal, newest first. Proposals are reviewed bitmaps, never templates.
      responses:
        '200':
          description: The proposals.
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                additionalProperties: false
                properties:
                  proposals:
                    type: array
                    items: { $ref: '#/components/schemas/DesignProposal' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /design/proposals/{proposalId}:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    get:
      tags: [design]
      operationId: getDesignProposal
      description: A proposal with its generation (prompt, instructions, references, estimate), usage, cost, decisions and variants.
      responses:
        '200':
          description: The proposal detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignProposalDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [design]
      operationId: deleteDesignProposal
      description: |
        Discard a proposal: it leaves the library and can no longer be reviewed or used for a variant. Logical deletion:
        the row, its decisions and its files are kept. Refused (409 RUN_IN_PROGRESS) while a variant of it is being
        generated.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /design/proposals/{proposalId}/file:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    get:
      tags: [design]
      operationId: getDesignProposalFile
      description: |
        The proposal image (the generated background with the original brand layers drawn over it), after a hash check,
        with a sandboxed CSP and no caching.
      responses:
        '200':
          description: The image.
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /design/proposals/{proposalId}/background:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    get:
      tags: [design]
      operationId: getDesignProposalBackground
      description: |
        The bitmap generated by the provider, without the original brand layers (the proposal image itself when no
        layer was drawn), after a hash check, with a sandboxed CSP and no caching.
      responses:
        '200':
          description: The image.
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /design/proposals/{proposalId}/decisions:
    parameters:
      - $ref: '#/components/parameters/ProposalId'
    post:
      tags: [design]
      operationId: decideDesignProposal
      description: |
        Record a review decision (approve, reject or request changes with a note). Decisions are append-only; the last
        one is the proposal's status. No template, brand asset or project changes.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              additionalProperties: false
              properties:
                decision: { type: string, enum: [approved, rejected, changes_requested] }
                note: { type: string, minLength: 1, maxLength: 1200, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }
      responses:
        '200':
          description: The reviewed proposal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignProposal' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /visual-templates:
    get:
      tags: [visual-templates]
      operationId: listVisualTemplates
      description: |
        Structured visual templates (PD-ARCH-01G-C) that are not deleted, most recently changed first: name, category,
        content type, format, status (draft, published or archived), source proposal and versions.
      responses:
        '200':
          description: The templates.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                additionalProperties: false
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/VisualTemplate' }
        '403': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    post:
      tags: [visual-templates]
      operationId: createVisualTemplate
      description: |
        Create a template and its first draft version from an approved, not deleted design proposal (local operation,
        no AI call). The proposal's clean background is referenced by its hash and its original brand layers become
        layers. An own-prompt proposal needs acknowledgeWarnings (409 TEMPLATE_SOURCE_REFUSED otherwise), as does a
        proposal that is not approved.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisualTemplateCreate' }
      responses:
        '201':
          description: The template and its versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisualTemplateDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /visual-templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/VisualTemplateId'
    get:
      tags: [visual-templates]
      operationId: getVisualTemplate
      description: A template with the summary of its kept versions (discarded drafts left out).
      responses:
        '200':
          description: The template and its versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisualTemplateDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [visual-templates]
      operationId: updateVisualTemplate
      description: Change the name, description or category. An archived template is read only (409 VERSION_CONFLICT).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisualTemplateUpdate' }
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisualTemplate' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [visual-templates]
      operationId: deleteVisualTemplate
      description: |
        Delete a template that was never published (logical deletion; the rows are kept). A template with a published
        version is archived instead (409 TEMPLATE_IN_USE).
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /visual-templates/{templateId}/archive:
    parameters:
      - $ref: '#/components/parameters/VisualTemplateId'
    post:
      tags: [visual-templates]
      operationId: archiveVisualTemplate
      description: Archive a template; it becomes read only and its published versions are kept unchanged.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisualTemplate' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /visual-templates/{templateId}/restore:
    parameters:
      - $ref: '#/components/parameters/VisualTemplateId'
    post:
      tags: [visual-templates]
      operationId: restoreVisualTemplate
      description: Restore an archived template.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisualTemplate' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /visual-templates/{templateId}/versions:
    parameters:
      - $ref: '#/components/parameters/VisualTemplateId'
    post:
      tags: [visual-templates]
      operationId: createVisualTemplateVersion
      description: |
        Start a new draft version copied from a published version (the latest one when fromVersionId is absent). The
        version it starts from does not change. 409 VERSION_CONFLICT when the template already has a draft.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisualTemplateVersionCreate' }
      responses:
        '201':
          description: The new draft version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisualTemplateVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /visual-templates/{templateId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/VisualTemplateId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [visual-templates]
      operationId: getVisualTemplateVersion
      description: A version with its background, layers, bindings, pinned assets and current validation.
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisualTemplateVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    put:
      tags: [visual-templates]
      operationId: saveVisualTemplateVersion
      description: |
        Save a draft from the revision it was read at (409 VERSION_CONFLICT when it changed). A published version is
        never changed (409 TEMPLATE_VERSION_PUBLISHED). A draft with validation errors is saved and reports them.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisualTemplateVersionSave' }
      responses:
        '200':
          description: The saved version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisualTemplateVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [visual-templates]
      operationId: deleteVisualTemplateVersion
      description: |
        Discard a draft when the template has a published version (the row is kept). A published version is never
        deleted.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204': { description: Discarded. }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /visual-templates/{templateId}/versions/{versionId}/release:
    parameters:
      - $ref: '#/components/parameters/VisualTemplateId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [visual-templates]
      operationId: releaseVisualTemplateVersion
      description: |
        Publish a draft at its current revision when its validation has no error (409 TEMPLATE_NOT_PUBLISHABLE
        otherwise). The published version is immutable.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisualTemplatePublish' }
      responses:
        '200':
          description: The published version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisualTemplateVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /visual-templates/{templateId}/versions/{versionId}/background:
    parameters:
      - $ref: '#/components/parameters/VisualTemplateId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [visual-templates]
      operationId: getVisualTemplateBackground
      description: |
        The background file of a version, read from its store and checked against its pinned hash, with a sandboxed
        CSP and no caching.
      responses:
        '200':
          description: The image.
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /visual-templates/{templateId}/versions/{versionId}/previews:
    parameters:
      - $ref: '#/components/parameters/VisualTemplateId'
      - $ref: '#/components/parameters/VersionId'
    post:
      tags: [visual-templates]
      operationId: previewVisualTemplate
      description: |
        Resolve the version's bindings with existing local sports data (a match for match content types, a round for
        a round calendar) and report missing values and overflowing text. Nothing is stored and nothing is sent to an
        AI provider. imageUrl is the PNG drawn by the slide engine for the same selection.
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisualTemplatePreviewRequest' }
      responses:
        '200':
          description: The resolved values and the preview issues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisualTemplatePreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
  /visual-templates/{templateId}/versions/{versionId}/preview:
    parameters:
      - $ref: '#/components/parameters/VisualTemplateId'
      - $ref: '#/components/parameters/VersionId'
      - name: competitionId
        in: query
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: seasonId
        in: query
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: roundId
        in: query
        required: false
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: matchId
        in: query
        required: false
        schema: { $ref: '#/components/schemas/Uuid' }
      - name: language
        in: query
        required: false
        schema: { $ref: '#/components/schemas/Language' }
      - name: revision
        in: query
        required: false
        schema: { type: string, pattern: '^[1-9][0-9]{0,8}$' }
    get:
      tags: [visual-templates]
      operationId: renderVisualTemplatePreview
      description: |
        The PNG of a version for the selected local sports data, drawn by the slide engine with the same render model,
        fonts and palette as the final slides. Cached in memory by version, revision, selection and language (bounded
        work per request).
      responses:
        '200':
          description: Preview.
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '421': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    ClientHeader:
      name: X-EDR-Client
      in: header
      required: true
      description: Required on every request whose method is not GET or HEAD (local cross-origin request protection, RK-13).
      schema: { type: string, const: web }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    FactId:
      name: factId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CarouselId:
      name: carouselId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ElementId:
      name: elementId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ManualVersionId:
      name: versionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CompetitionId:
      name: competitionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    SourceIdParam:
      name: sourceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SourceId' }
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    Position:
      name: position
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 99 }
    GenerationId:
      name: generationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    VisualTemplateId:
      name: templateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Uuid:
      description: Server-generated identifier (crypto.randomUUID), lowercase.
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Slug:
      description: Catalogue, season, stage, team-key or template identifier.
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
    SourceId:
      type: string
      minLength: 2
      maxLength: 41
      pattern: '^[a-z0-9][a-z0-9-]{1,40}$'
    MatchKey:
      description: Canonical match key assigned by the verification stage.
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[a-z0-9][a-z0-9:_-]{0,127}$'
    Label:
      description: Printable text; control and format characters (\p{Cc}, \p{Cf}) are refused.
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[^\p{Cc}\p{Cf}]{1,80}$'
    DisplayName:
      description: Competition, area or season name; letters, marks, digits, spaces and . ' & ( ) / - only.
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[\p{L}\p{M}\p{N} .''&()/-]{1,80}$'
    Competition:
      type: object
      required: [id, name, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/DisplayName' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SportsProvider:
      type: object
      required: [key, name, capabilities, availability, availabilityMessage]
      additionalProperties: false
      properties:
        key: { $ref: '#/components/schemas/SourceId' }
        name: { $ref: '#/components/schemas/DisplayName' }
        capabilities:
          type: object
          required: [competitionCatalogue, seasons, stages]
          additionalProperties: false
          properties:
            competitionCatalogue: { type: boolean }
            seasons: { type: boolean }
            stages: { type: boolean }
        availability: { type: string, enum: [available, not_configured, disabled, ambiguous] }
        availabilityMessage: { anyOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }] }
    ExternalCompetition:
      type: object
      required: [externalCompetitionId, name, areaName]
      additionalProperties: false
      properties:
        externalCompetitionId: { type: string, minLength: 1, maxLength: 120 }
        name: { $ref: '#/components/schemas/DisplayName' }
        areaName: { anyOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }] }
    CompetitionProviderBinding:
      type: object
      required: [id, competitionId, providerKey, providerName, externalCompetitionId, externalCompetitionName, mode, status, linkedAt, unlinkedAt, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        competitionId: { $ref: '#/components/schemas/Uuid' }
        providerKey: { $ref: '#/components/schemas/SourceId' }
        providerName: { $ref: '#/components/schemas/DisplayName' }
        externalCompetitionId: { type: string, minLength: 1, maxLength: 120 }
        externalCompetitionName: { $ref: '#/components/schemas/DisplayName' }
        mode: { type: string, enum: [provider, hybrid] }
        status: { type: string, enum: [active, replaced, unlinked] }
        linkedAt: { type: string, format: date-time }
        unlinkedAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompetitionProviderBindingResponse:
      type: object
      required: [binding]
      additionalProperties: false
      properties:
        binding: { anyOf: [{ $ref: '#/components/schemas/CompetitionProviderBinding' }, { type: 'null' }] }
    ImportResource:
      type: string
      enum: [season, teams, participants, stages, rounds, matches, results]
    ExternalSeasonId:
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^(?!\.{1,2}$)[A-Za-z0-9._-]{1,120}$'
    ExternalSeasonOption:
      type: object
      required: [externalSeasonId, label, startDate, endDate, current, localCandidates]
      additionalProperties: false
      properties:
        externalSeasonId: { type: string, minLength: 1, maxLength: 120 }
        label: { $ref: '#/components/schemas/DisplayName' }
        startDate: { anyOf: [{ type: string, format: date }, { type: 'null' }] }
        endDate: { anyOf: [{ type: string, format: date }, { type: 'null' }] }
        current: { type: boolean }
        localCandidates: { type: array, maxItems: 20, items: { type: object, required: [id, label], additionalProperties: false, properties: { id: { $ref: '#/components/schemas/Uuid' }, label: { $ref: '#/components/schemas/DisplayName' } } } }
    ExternalSeasonListResponse:
      type: object
      required: [seasons]
      additionalProperties: false
      properties:
        seasons: { type: array, items: { $ref: '#/components/schemas/ExternalSeasonOption' } }
    ImportResourceCapability:
      type: object
      required: [resource, available, reason]
      additionalProperties: false
      properties:
        resource: { $ref: '#/components/schemas/ImportResource' }
        available: { type: boolean }
        reason: { anyOf: [{ type: string, maxLength: 240 }, { type: 'null' }] }
    ImportCapabilitiesResponse:
      type: object
      required: [capabilities]
      additionalProperties: false
      properties:
        capabilities: { type: array, items: { $ref: '#/components/schemas/ImportResourceCapability' } }
    ImportOperation:
      type: object
      required: [operationId, competitionId, providerKey, externalSeasonId, destinationSeasonId, resources, status, currentStage, completedStages, cancellationRequested, previewId, errorCode, errorMessage, createdAt, startedAt, updatedAt, completedAt]
      additionalProperties: false
      properties:
        operationId: { $ref: '#/components/schemas/Uuid' }
        competitionId: { $ref: '#/components/schemas/Uuid' }
        providerKey: { type: string, minLength: 1, maxLength: 40 }
        externalSeasonId: { type: string, minLength: 1, maxLength: 120 }
        destinationSeasonId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        resources: { type: array, minItems: 1, maxItems: 7, items: { $ref: '#/components/schemas/ImportResource' } }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        currentStage: { anyOf: [{ type: string, enum: [fetching, normalizing, comparing, preparing_preview] }, { type: 'null' }] }
        completedStages: { type: array, maxItems: 4, items: { type: string, enum: [fetching, normalizing, comparing, preparing_preview] } }
        cancellationRequested: { type: boolean }
        previewId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        errorCode: { anyOf: [{ type: string, maxLength: 80 }, { type: 'null' }] }
        errorMessage: { anyOf: [{ type: string, maxLength: 240 }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        startedAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        updatedAt: { type: string, format: date-time }
        completedAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
    ImportOperationResponse:
      type: object
      required: [operation]
      additionalProperties: false
      properties:
        operation: { $ref: '#/components/schemas/ImportOperation' }
    ImportOperationStartResponse:
      type: object
      required: [operation, statusUrl, eventsUrl]
      additionalProperties: false
      properties:
        operation: { $ref: '#/components/schemas/ImportOperation' }
        statusUrl: { type: string, pattern: '^/api/v1/competitions/' }
        eventsUrl: { type: string, pattern: '^/api/v1/competitions/' }
    ImportPreviewRequest:
      type: object
      required: [externalSeasonId, resources]
      additionalProperties: false
      properties:
        externalSeasonId: { type: string, minLength: 1, maxLength: 120 }
        destinationSeasonId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        resources: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { $ref: '#/components/schemas/ImportResource' } }
    ImportPreviewItem:
      type: object
      required: [resource, externalId, externalScope, title, operation, localCandidate, relationships, fields, warnings]
      additionalProperties: false
      properties:
        resource: { $ref: '#/components/schemas/ImportResource' }
        externalId: { type: string, minLength: 1, maxLength: 200 }
        externalScope: { anyOf: [{ type: string, maxLength: 200 }, { type: 'null' }] }
        title: { $ref: '#/components/schemas/DisplayName' }
        operation: { type: string, enum: [new, changed, unchanged, conflict, invalid, skipped] }
        localCandidate: { anyOf: [{ type: object, required: [id, label], additionalProperties: false, properties: { id: { $ref: '#/components/schemas/Uuid' }, label: { $ref: '#/components/schemas/DisplayName' } } }, { type: 'null' }] }
        relationships: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/ImportExternalReference' } }
        fields: { type: array, maxItems: 40, items: { type: object, required: [name, localValue, incomingValue, baselineValue, protected], additionalProperties: false, properties: { name: { type: string, minLength: 1, maxLength: 80 }, localValue: { anyOf: [{ type: string, maxLength: 500 }, { type: number }, { type: boolean }, { type: 'null' }] }, incomingValue: { anyOf: [{ type: string, maxLength: 500 }, { type: number }, { type: boolean }, { type: 'null' }] }, baselineValue: { anyOf: [{ type: string, maxLength: 500 }, { type: number }, { type: boolean }, { type: 'null' }] }, protected: { type: boolean } } } }
        warnings: { type: array, maxItems: 20, items: { type: string, maxLength: 240 } }
    ImportPreviewSummary:
      type: object
      required: [new, changed, unchanged, conflicts, invalid, skipped]
      additionalProperties: false
      properties:
        new: { type: integer, minimum: 0 }
        changed: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        conflicts: { type: integer, minimum: 0 }
        invalid: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
    ImportExternalReference:
      type: object
      required: [role, externalId, externalScope]
      additionalProperties: false
      properties:
        role: { type: string, enum: [season, team, home_team, away_team, stage, round, match] }
        externalId: { type: string, minLength: 1, maxLength: 200 }
        externalScope: { anyOf: [{ type: string, maxLength: 200 }, { type: 'null' }] }
    ImportPreviewWarning:
      type: object
      required: [code, severity, message, occurrenceCount, affectedExternalIds]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        severity: { type: string, enum: [info, warning, error, conflict] }
        message: { type: string, minLength: 1, maxLength: 240 }
        occurrenceCount: { type: integer, minimum: 1 }
        affectedExternalIds: { type: array, maxItems: 500, items: { type: string, minLength: 1, maxLength: 200 } }
    ImportPreview:
      type: object
      required: [previewId, competitionId, providerKey, providerName, externalCompetitionName, externalSeasonId, externalSeasonLabel, destinationSeasonId, retrievedAt, expiresAt, snapshotHash, localFingerprint, stale, resources, summary, capabilities, warnings, items]
      additionalProperties: false
      properties:
        previewId: { $ref: '#/components/schemas/Uuid' }
        competitionId: { $ref: '#/components/schemas/Uuid' }
        providerKey: { $ref: '#/components/schemas/SourceId' }
        providerName: { $ref: '#/components/schemas/DisplayName' }
        externalCompetitionName: { $ref: '#/components/schemas/DisplayName' }
        externalSeasonId: { type: string, minLength: 1, maxLength: 120 }
        externalSeasonLabel: { $ref: '#/components/schemas/DisplayName' }
        destinationSeasonId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        retrievedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        localFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        stale: { type: boolean }
        resources: { type: array, items: { $ref: '#/components/schemas/ImportResource' } }
        summary: { $ref: '#/components/schemas/ImportPreviewSummary' }
        capabilities: { type: array, items: { $ref: '#/components/schemas/ImportResourceCapability' } }
        warnings: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ImportPreviewWarning' } }
        items: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/ImportPreviewItem' } }
    ImportPreviewResponse:
      type: object
      required: [preview]
      additionalProperties: false
      properties:
        preview: { $ref: '#/components/schemas/ImportPreview' }
    ImportApplyDecision:
      type: object
      required: [resource, externalId, externalScope, action, localId]
      additionalProperties: false
      properties:
        resource: { $ref: '#/components/schemas/ImportResource' }
        externalId: { type: string, minLength: 1, maxLength: 200 }
        externalScope: { anyOf: [{ type: string, maxLength: 200 }, { type: 'null' }] }
        action: { type: string, enum: [link, skip, accept_incoming] }
        localId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    ImportApplyPlanRequest:
      type: object
      required: [decisions]
      additionalProperties: false
      properties:
        decisions: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/ImportApplyDecision' } }
    ImportApplyStartRequest:
      type: object
      required: [decisions, planHash]
      additionalProperties: false
      properties:
        decisions: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/ImportApplyDecision' } }
        planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
    ImportApplyCounts:
      type: object
      required: [seasonsCreated, teamsCreated, teamsReused, associationsCreated, participantsCreated, stagesCreated, roundsCreated, matchesCreated, matchesUpdated, resultsApplied, mappingsCreated, unchanged, skipped, conflictsNotApplied]
      additionalProperties: false
      properties:
        seasonsCreated: { type: integer, minimum: 0 }
        teamsCreated: { type: integer, minimum: 0 }
        teamsReused: { type: integer, minimum: 0 }
        associationsCreated: { type: integer, minimum: 0 }
        participantsCreated: { type: integer, minimum: 0 }
        stagesCreated: { type: integer, minimum: 0 }
        roundsCreated: { type: integer, minimum: 0 }
        matchesCreated: { type: integer, minimum: 0 }
        matchesUpdated: { type: integer, minimum: 0 }
        resultsApplied: { type: integer, minimum: 0 }
        mappingsCreated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        conflictsNotApplied: { type: integer, minimum: 0 }
    ImportApplyPlanItem:
      type: object
      required: [resource, externalId, externalScope, title, action, reason, localId, localLabel, candidates, options, decision, changes]
      additionalProperties: false
      properties:
        resource: { $ref: '#/components/schemas/ImportResource' }
        externalId: { type: string, minLength: 1, maxLength: 200 }
        externalScope: { anyOf: [{ type: string, maxLength: 200 }, { type: 'null' }] }
        title: { $ref: '#/components/schemas/DisplayName' }
        action: { type: string, enum: [create, link, reuse, update, unchanged, keep_local, skip, blocked] }
        reason: { anyOf: [{ type: string, maxLength: 240 }, { type: 'null' }] }
        localId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        localLabel: { anyOf: [{ type: string, maxLength: 160 }, { type: 'null' }] }
        candidates: { type: array, maxItems: 20, items: { type: object, required: [id, label], additionalProperties: false, properties: { id: { $ref: '#/components/schemas/Uuid' }, label: { type: string, minLength: 1, maxLength: 160 } } } }
        options: { type: array, maxItems: 3, items: { type: string, enum: [link, skip, accept_incoming] } }
        decision: { anyOf: [{ type: string, enum: [link, skip, accept_incoming] }, { type: 'null' }] }
        changes: { type: array, maxItems: 10, items: { type: object, required: [field, localValue, incomingValue, applied], additionalProperties: false, properties: { field: { type: string, minLength: 1, maxLength: 80 }, localValue: { anyOf: [{ type: string, maxLength: 500 }, { type: number }, { type: boolean }, { type: 'null' }] }, incomingValue: { anyOf: [{ type: string, maxLength: 500 }, { type: number }, { type: boolean }, { type: 'null' }] }, applied: { type: boolean } } } }
    ImportApplyBlocker:
      type: object
      required: [code, message, count]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        message: { type: string, minLength: 1, maxLength: 240 }
        count: { type: integer, minimum: 1 }
    ImportApplyPlan:
      type: object
      required: [previewId, competitionId, providerName, externalCompetitionName, externalSeasonLabel, destinationSeasonId, destinationLabel, destinationIsNew, expiresAt, planHash, ready, totals, counts, blockers, warnings, reviewItems, reviewItemsTruncated]
      additionalProperties: false
      properties:
        previewId: { $ref: '#/components/schemas/Uuid' }
        competitionId: { $ref: '#/components/schemas/Uuid' }
        providerName: { $ref: '#/components/schemas/DisplayName' }
        externalCompetitionName: { $ref: '#/components/schemas/DisplayName' }
        externalSeasonLabel: { $ref: '#/components/schemas/DisplayName' }
        destinationSeasonId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        destinationLabel: { type: string, minLength: 1, maxLength: 160 }
        destinationIsNew: { type: boolean }
        expiresAt: { type: string, format: date-time }
        planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        ready: { type: boolean }
        totals:
          type: object
          required: [create, update, unchanged, keepLocal, skip, blocked]
          additionalProperties: false
          properties:
            create: { type: integer, minimum: 0 }
            update: { type: integer, minimum: 0 }
            unchanged: { type: integer, minimum: 0 }
            keepLocal: { type: integer, minimum: 0 }
            skip: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
        counts: { $ref: '#/components/schemas/ImportApplyCounts' }
        blockers: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ImportApplyBlocker' } }
        warnings: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 240 } }
        reviewItems: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/ImportApplyPlanItem' } }
        reviewItemsTruncated: { type: boolean }
    ImportApplyPlanResponse:
      type: object
      required: [plan]
      additionalProperties: false
      properties:
        plan: { $ref: '#/components/schemas/ImportApplyPlan' }
    ImportApplication:
      type: object
      required: [applicationId, operationId, previewId, competitionId, providerName, externalSeasonLabel, destinationSeasonId, destinationSeasonLabel, appliedAt, counts, notApplied]
      additionalProperties: false
      properties:
        applicationId: { $ref: '#/components/schemas/Uuid' }
        operationId: { $ref: '#/components/schemas/Uuid' }
        previewId: { $ref: '#/components/schemas/Uuid' }
        competitionId: { $ref: '#/components/schemas/Uuid' }
        providerName: { $ref: '#/components/schemas/DisplayName' }
        externalSeasonLabel: { $ref: '#/components/schemas/DisplayName' }
        destinationSeasonId: { $ref: '#/components/schemas/Uuid' }
        destinationSeasonLabel: { $ref: '#/components/schemas/DisplayName' }
        appliedAt: { type: string, format: date-time }
        counts: { $ref: '#/components/schemas/ImportApplyCounts' }
        notApplied: { type: array, maxItems: 500, items: { type: object, required: [resource, externalId, title, action, reason], additionalProperties: false, properties: { resource: { $ref: '#/components/schemas/ImportResource' }, externalId: { type: string, minLength: 1, maxLength: 200 }, title: { $ref: '#/components/schemas/DisplayName' }, action: { type: string, enum: [keep_local, skip] }, reason: { anyOf: [{ type: string, maxLength: 240 }, { type: 'null' }] } } } }
    ImportApplyOperation:
      type: object
      required: [operationId, competitionId, previewId, status, currentStage, completedStages, cancellationRequested, cancellable, application, errorCode, errorMessage, createdAt, startedAt, updatedAt, completedAt]
      additionalProperties: false
      properties:
        operationId: { $ref: '#/components/schemas/Uuid' }
        competitionId: { $ref: '#/components/schemas/Uuid' }
        previewId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        currentStage: { anyOf: [{ type: string, enum: [validating, resolving_identities, transforming, persisting] }, { type: 'null' }] }
        completedStages: { type: array, maxItems: 4, items: { type: string, enum: [validating, resolving_identities, transforming, persisting] } }
        cancellationRequested: { type: boolean }
        cancellable: { type: boolean }
        application: { anyOf: [{ $ref: '#/components/schemas/ImportApplication' }, { type: 'null' }] }
        errorCode: { anyOf: [{ type: string, maxLength: 80 }, { type: 'null' }] }
        errorMessage: { anyOf: [{ type: string, maxLength: 240 }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        startedAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        updatedAt: { type: string, format: date-time }
        completedAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
    ImportApplyOperationResponse:
      type: object
      required: [operation]
      additionalProperties: false
      properties:
        operation: { $ref: '#/components/schemas/ImportApplyOperation' }
    ImportApplyOperationStartResponse:
      type: object
      required: [operation, statusUrl, eventsUrl]
      additionalProperties: false
      properties:
        operation: { $ref: '#/components/schemas/ImportApplyOperation' }
        statusUrl: { type: string, pattern: '^/api/v1/competitions/' }
        eventsUrl: { type: string, pattern: '^/api/v1/competitions/' }
    SportsFieldProvenance:
      type: object
      required: [field, origin, providerKey, externalReference, protected, lastApplicationId, updatedAt]
      additionalProperties: false
      properties:
        field: { type: string, minLength: 1, maxLength: 80 }
        origin: { type: string, enum: [manual, provider, manual_override] }
        providerKey: { anyOf: [{ type: string, minLength: 1, maxLength: 64 }, { type: 'null' }] }
        externalReference: { anyOf: [{ type: string, minLength: 1, maxLength: 200 }, { type: 'null' }] }
        providerValue: { anyOf: [{ type: string, maxLength: 500 }, { type: number }, { type: boolean }, { type: 'null' }] }
        protected: { type: boolean }
        lastApplicationId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        updatedAt: { type: string, format: date-time }
    SportsFieldProvenanceResponse:
      type: object
      required: [fields]
      additionalProperties: false
      properties:
        fields: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/SportsFieldProvenance' } }
    ImportApplicationHistoryResponse:
      type: object
      required: [applications]
      additionalProperties: false
      properties:
        applications: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ImportApplication' } }
    ManagedSeason:
      type: object
      required: [id, competitionId, label, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        competitionId: { $ref: '#/components/schemas/Uuid' }
        label: { $ref: '#/components/schemas/DisplayName' }
        createdAt: { type: string, format: date-time }
    ManagedTeam:
      type: object
      required: [id, name, region, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/TeamName' }
        region: { anyOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CompetitionTeam:
      type: object
      required: [team, associatedAt]
      additionalProperties: false
      properties:
        team: { $ref: '#/components/schemas/ManagedTeam' }
        associatedAt: { type: string, format: date-time }
    SeasonParticipant:
      type: object
      required: [team, joinedAt]
      additionalProperties: false
      properties:
        team: { $ref: '#/components/schemas/ManagedTeam' }
        joinedAt: { type: string, format: date-time }
    CompetitionStage:
      type: object
      required: [id, seasonId, name, displayOrder, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        seasonId: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/DisplayName' }
        displayOrder: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    CompetitionRound:
      type: object
      required: [id, seasonId, stageId, name, displayOrder, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        seasonId: { $ref: '#/components/schemas/Uuid' }
        stageId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        name: { $ref: '#/components/schemas/DisplayName' }
        displayOrder: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    CompetitionMatchStatus:
      type: string
      enum: [scheduled, in_progress, finished, postponed, cancelled]
    CompetitionMatch:
      type: object
      required: [id, seasonId, stage, round, homeTeam, awayTeam, kickoffAt, status, homeScore, awayScore, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        seasonId: { $ref: '#/components/schemas/Uuid' }
        stage:
          anyOf:
            - type: object
              required: [id, name]
              additionalProperties: false
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                name: { $ref: '#/components/schemas/DisplayName' }
            - type: 'null'
        round:
          anyOf:
            - type: object
              required: [id, name]
              additionalProperties: false
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                name: { $ref: '#/components/schemas/DisplayName' }
            - type: 'null'
        homeTeam: { $ref: '#/components/schemas/ManagedTeam' }
        awayTeam: { $ref: '#/components/schemas/ManagedTeam' }
        kickoffAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/CompetitionMatchStatus' }
        homeScore: { anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        awayScore: { anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MatchResultHistory:
      type: object
      required: [id, matchId, changeType, stageId, roundId, status, homeScore, awayScore, kickoffAt, recordedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        matchId: { $ref: '#/components/schemas/Uuid' }
        changeType: { type: string, enum: [created, schedule_updated, status_updated, result_recorded, result_corrected] }
        stageId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        roundId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/CompetitionMatchStatus' }
        homeScore: { anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        awayScore: { anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        kickoffAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        recordedAt: { type: string, format: date-time }
    StageName:
      description: Stage name as the source gives it; letters, marks, digits, spaces and . ' & ( ) / _ - only.
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[\p{L}\p{M}\p{N} .''&()/_-]{1,80}$'
    TeamName:
      description: Team name; letters, marks, digits, spaces and . ' & ( ) - only (T10-F06 rule).
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[\p{L}\p{M}\p{N} .''&()-]{1,64}$'
    FileName:
      description: 'Name of an imported file, without any path; extension .json or .csv. Metadata only, never used as a path. Combining marks are accepted so that decomposed (NFD) names are not refused; the UI sends names normalized to NFC (T11H-F20).'
      type: string
      minLength: 6
      maxLength: 120
      pattern: '^[\p{L}\p{M}\p{N} ._()-]{1,115}\.(json|csv)$'
    DataMode:
      description: Data acquisition mode (PD-13).
      type: string
      enum: [LIVE_DATA, MANUAL_DATA, DEMO_DATA]
    MatchStatus:
      description: Provider-neutral match status; every source status is mapped to one of these by its adapter.
      type: string
      enum: [scheduled, in_play, finished, postponed, suspended, cancelled, abandoned, awarded]
    Problem:
      type: object
      required: [type, title, status, code]
      additionalProperties: false
      properties:
        type: { type: string, maxLength: 200, description: '"about:blank" or "urn:edr:problem:<code>"' }
        title: { type: string, maxLength: 200 }
        status: { type: integer }
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - NOT_FOUND
            - FORBIDDEN_ORIGIN
            - MISDIRECTED_HOST
            - UNSUPPORTED_MEDIA_TYPE
            - PAYLOAD_TOO_LARGE
            - RUN_IN_PROGRESS
            - NO_VERIFIED_RUN
            - VERSION_CONFLICT
            - APPROVAL_BLOCKED
            - CONTENT_FLAGGED
            - QA_FAILED
            - QA_ACK_REQUIRED
            - FINAL_APPROVAL_REFUSED
            - FINAL_APPROVAL_REQUIRED
            - EXPORT_FILES_MISSING
            - EXPORT_FILES_CORRUPT
            - DUPLICATE_ASSET
            - DUPLICATE_SEASON
            - DUPLICATE_TEAM
            - DUPLICATE_PARTICIPANT
            - DUPLICATE_COMPETITION_TEAM
            - COMPETITION_TEAM_IN_USE
            - TEAM_NOT_IN_COMPETITION
            - DUPLICATE_STAGE
            - DUPLICATE_ROUND
            - DUPLICATE_MATCH
            - TEAM_IN_USE
            - PROVIDER_FAILED
            - PROVIDER_BINDING_EXISTS
            - PROVIDER_AMBIGUOUS
            - PROVIDER_RATE_LIMITED
            - SELECTION_UNAVAILABLE
            - IMPORT_REJECTED
            - MANUAL_APPROVAL_REFUSED
            - INTERNAL
            - PROVIDER_UNAVAILABLE
            - IMPORT_PREVIEW_EXPIRED
            - CONTENT_BATCH_NOT_GENERATABLE
            - REQUEST_KEY_REUSED
            - ASSET_IN_USE
            - IMAGE_PROVIDER_UNAVAILABLE
            - DESIGN_REFERENCE_REFUSED
            - GENERATION_LIMIT_REACHED
            - TEMPLATE_SOURCE_REFUSED
            - TEMPLATE_VERSION_PUBLISHED
            - TEMPLATE_NOT_PUBLISHABLE
            - TEMPLATE_IN_USE
            - PROPOSAL_IN_USE
        detail: { type: string, maxLength: 500, description: 'Fixed text plus sanitized parameters only (T10-F10)' }
        errors:
          type: array
          maxItems: 50
          items:
            type: object
            required: [path, message]
            additionalProperties: false
            properties:
              path: { type: string, maxLength: 200 }
              message: { type: string, maxLength: 200 }
        facts:
          description: Facts that block an approval (APPROVAL_BLOCKED), each named with its block reason (R-206, R-271, R-272).
          type: array
          items: { $ref: '#/components/schemas/FactRef' }
        items:
          description: Elements that prevent a final approval (FINAL_APPROVAL_REFUSED).
          type: array
          items:
            type: object
            required: [elementId, reason]
            additionalProperties: false
            properties:
              elementId: { $ref: '#/components/schemas/Uuid' }
              reason: { type: string, enum: [not_approved, blocked, flagged, qa_failed, qa_ack_required] }
        importErrors:
          description: Every error of a rejected import, reported together (IMPORT_REJECTED, R-274).
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/ImportError' }
        retryAfterSeconds:
          description: Seconds until the provider request budget allows a new request (PROVIDER_RATE_LIMITED, R-291).
          type: [integer, 'null']
          minimum: 0
        refusalReason:
          description: Reason of a MANUAL_APPROVAL_REFUSED or SELECTION_UNAVAILABLE problem.
          type: [string, 'null']
          enum: [not_manual_data, verified, disputed, team_identity_unmatched, accepted_source_disagrees, not_latest_run, already_approved, not_approved, competition_unavailable, season_unavailable, stage_unavailable, source_not_selectable, null]
    Failure:
      description: Stage or run failure built from a closed code and sanitized parameters only (T10-F10).
      type: object
      required: [code, sourceId, path, httpStatus]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [unavailable, rate_limited, timeout, no_data, invalid, access_refused, not_available, bad_request, ai_response_invalid, interrupted, stage_not_available, run_superseded, internal]
        sourceId:
          oneOf:
            - $ref: '#/components/schemas/SourceId'
            - type: 'null'
        path: { type: [string, 'null'], maxLength: 200, description: 'Validation path inside a payload, never a file path' }
        httpStatus: { type: [integer, 'null'] }
    Language:
      type: string
      enum: [es, en]
    Settings:
      type: object
      required: [languages, defaultLanguage, format, publicationMode, dataModes, verificationPolicy, providers]
      additionalProperties: false
      properties:
        languages:
          type: array
          items:
            type: object
            required: [code, label]
            additionalProperties: false
            properties:
              code: { $ref: '#/components/schemas/Language' }
              label: { type: string }
        defaultLanguage: { $ref: '#/components/schemas/Language' }
        format:
          type: object
          required: [width, height, maxSlidesPerCarousel]
          additionalProperties: false
          properties:
            width: { type: integer }
            height: { type: integer }
            maxSlidesPerCarousel: { type: integer }
        publicationMode: { type: string, enum: [manual] }
        dataModes:
          description: Data acquisition modes with at least one enabled source.
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/DataMode' }
        verificationPolicy:
          description: 'Configured publication policies as decided by PD-17 (R-429) and PD-18 (R-430) and applied by AD-38. The configuration accepts only manuallyApprovedPublication blocked or allowed_without_accepted_source (default) and livePublicationPermissionRule every_supporting_source (default), so the server emits only those values.'
          type: object
          required: [manuallyApprovedPublication, livePublicationPermissionRule]
          additionalProperties: false
          properties:
            manuallyApprovedPublication: { type: string, enum: [blocked, allowed_labelled, allowed_without_accepted_source] }
            livePublicationPermissionRule: { type: string, enum: [every_supporting_source, any_supporting_source] }
        providers:
          description: Adapter IDs, modes and source roles only; never credentials, tokens or base URLs.
          type: object
          required: [sources, ai]
          additionalProperties: false
          properties:
            sources:
              type: array
              items: { $ref: '#/components/schemas/SourceInfo' }
            ai: { type: string }
    SourceInfo:
      type: object
      required: [id, name, mode, role, officialPublication, accepted, enabled, publicationPermission]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/SourceId' }
        name: { type: string, maxLength: 80 }
        mode: { $ref: '#/components/schemas/DataMode' }
        role: { type: string, enum: [primary, verification] }
        officialPublication: { type: boolean }
        accepted: { type: boolean }
        enabled: { type: boolean }
        publicationPermission: { type: string, enum: [confirmed, unconfirmed, not_applicable] }
    Availability:
      description: Whether a source offers a competition, season or stage, and why not (R-075, R-286).
      type: object
      required: [available, reason]
      additionalProperties: false
      properties:
        available: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [subscription_restricted, not_found, access_refused, not_provided, source_unavailable, rate_limited, null]
    ListingMeta:
      description: Provenance of a catalogue listing (R-141, R-291).
      type: object
      required: [retrievedAt, fromCache, stale, retryAfterSeconds]
      additionalProperties: false
      properties:
        retrievedAt: { type: [string, 'null'], format: date-time }
        fromCache: { type: boolean }
        stale: { type: boolean, description: 'True when a cached listing past its validity is shown because the request budget is exhausted' }
        retryAfterSeconds: { type: [integer, 'null'], minimum: 0 }
    SourceListing:
      type: object
      required: [sourceId, sourceName, mode, availability, listing]
      additionalProperties: false
      properties:
        sourceId: { $ref: '#/components/schemas/SourceId' }
        sourceName: { type: string, maxLength: 80 }
        mode: { $ref: '#/components/schemas/DataMode' }
        availability: { $ref: '#/components/schemas/Availability' }
        listing: { $ref: '#/components/schemas/ListingMeta' }
    CompetitionSource:
      type: object
      required: [sourceId, sourceName, mode, selectable, availability]
      additionalProperties: false
      properties:
        sourceId: { $ref: '#/components/schemas/SourceId' }
        sourceName: { type: string, maxLength: 80 }
        mode: { $ref: '#/components/schemas/DataMode' }
        selectable: { type: boolean, description: 'True for enabled primary-role sources the operator can choose (R-431)' }
        availability: { $ref: '#/components/schemas/Availability' }
    CatalogueCompetition:
      type: object
      required: [id, name, areaName, reference, sources]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Slug' }
        name: { $ref: '#/components/schemas/DisplayName' }
        areaName:
          oneOf:
            - $ref: '#/components/schemas/DisplayName'
            - type: 'null'
        reference: { type: boolean, description: 'Marked by configuration as an initial reference scenario; listed first; no other effect' }
        sources:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CompetitionSource' }
    Catalogue:
      type: object
      required: [competitions, sources]
      additionalProperties: false
      properties:
        competitions:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/CatalogueCompetition' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceListing' }
    Season:
      type: object
      required: [id, label, current, startDate, endDate]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Slug' }
        label: { $ref: '#/components/schemas/DisplayName' }
        current: { type: boolean }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
    SeasonList:
      type: object
      required: [competitionId, sourceId, availability, listing, seasons]
      additionalProperties: false
      properties:
        competitionId: { $ref: '#/components/schemas/Slug' }
        sourceId: { $ref: '#/components/schemas/SourceId' }
        availability: { $ref: '#/components/schemas/Availability' }
        listing: { $ref: '#/components/schemas/ListingMeta' }
        seasons:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Season' }
    Stage:
      description: A stage of a season by the source's name; matchdays lists its numbered rounds, empty when the source does not number them (R-074, R-283).
      type: object
      required: [id, name, order, standings, selectableAsWhole, matchdays, availability]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Slug' }
        name: { $ref: '#/components/schemas/StageName' }
        order: { type: integer, minimum: 1 }
        standings: { type: string, enum: [expected, not_expected, unknown], description: 'Whether the source is expected to provide standings for selections of this stage' }
        selectableAsWhole: { type: boolean, description: 'True when the stage is selected without a matchday number' }
        matchdays:
          type: array
          maxItems: 99
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 999 }
        availability: { $ref: '#/components/schemas/Availability' }
    StageList:
      type: object
      required: [competitionId, sourceId, seasonId, availability, listing, stages]
      additionalProperties: false
      properties:
        competitionId: { $ref: '#/components/schemas/Slug' }
        sourceId: { $ref: '#/components/schemas/SourceId' }
        seasonId: { $ref: '#/components/schemas/Slug' }
        availability: { $ref: '#/components/schemas/Availability' }
        listing: { $ref: '#/components/schemas/ListingMeta' }
        stages:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/Stage' }
    ProjectCreate:
      type: object
      required: [competitionId, sourceId, seasonId, stageId, matchday]
      additionalProperties: false
      properties:
        competitionId: { $ref: '#/components/schemas/Slug' }
        sourceId: { $ref: '#/components/schemas/SourceId' }
        seasonId: { $ref: '#/components/schemas/Slug' }
        stageId: { $ref: '#/components/schemas/Slug' }
        matchday: { type: [integer, 'null'], minimum: 1, maximum: 999, description: 'Null when the stage is selected as a whole' }
        language: { $ref: '#/components/schemas/Language' }
    ProjectUpdate:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        language: { $ref: '#/components/schemas/Language' }
    ProjectSummary:
      allOf:
        - $ref: '#/components/schemas/ProjectSummaryFields'
      unevaluatedProperties: false
    ProjectSummaryFields:
      description: Open base object; closed by the schemas that use it (unevaluatedProperties).
      type: object
      required: [id, title, competitionName, seasonLabel, stageLabel, matchday, sourceName, dataMode, demonstration, language, createdAt, approvalState, lastExportAt, latestRunStatus, sportsContext]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, maxLength: 200 }
        competitionName: { $ref: '#/components/schemas/DisplayName' }
        seasonLabel: { $ref: '#/components/schemas/DisplayName' }
        stageLabel: { $ref: '#/components/schemas/StageName' }
        matchday: { type: [integer, 'null'] }
        sourceName: { type: string, maxLength: 80 }
        dataMode: { $ref: '#/components/schemas/DataMode' }
        demonstration: { type: boolean, description: 'True for DEMO_DATA projects (OD-21, R-269)' }
        language: { $ref: '#/components/schemas/Language' }
        createdAt: { type: string, format: date-time }
        approvalState: { type: string, enum: [no_draft, in_review, final_approved, exported] }
        lastExportAt: { type: [string, 'null'], format: date-time }
        latestRunStatus:
          description: Status of the project's latest run (PD-ARCH-01F), null before the first run.
          oneOf:
            - $ref: '#/components/schemas/RunStatus'
            - type: 'null'
        sportsContext:
          description: Local sports context of a project generated by a content batch (PD-ARCH-01E-A).
          oneOf:
            - $ref: '#/components/schemas/ProjectSportsContext'
            - type: 'null'
    Project:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ProjectSummaryFields'
        - type: object
          required: [competitionId, sourceId, seasonId, stageId, latestRun, activeDraftId]
          properties:
            competitionId: { $ref: '#/components/schemas/Slug' }
            sourceId: { $ref: '#/components/schemas/SourceId' }
            seasonId: { $ref: '#/components/schemas/Slug' }
            stageId: { $ref: '#/components/schemas/Slug' }
            latestRun:
              oneOf:
                - $ref: '#/components/schemas/Run'
                - type: 'null'
            activeDraftId:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
    ProjectSportsContext:
      description: Local sports context of a project generated by a content batch (PD-ARCH-01E-A).
      type: object
      required: [batchId, itemId, kind, competitionId, competitionName, seasonId, seasonLabel, stageId, stageName, roundId, roundName, matchIds]
      additionalProperties: false
      properties:
        batchId: { $ref: '#/components/schemas/Uuid' }
        itemId: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [round_results, match_result, round_calendar, upcoming_matches, match_preview] }
        competitionId: { $ref: '#/components/schemas/Uuid' }
        competitionName: { $ref: '#/components/schemas/DisplayName' }
        seasonId: { $ref: '#/components/schemas/Uuid' }
        seasonLabel: { $ref: '#/components/schemas/DisplayName' }
        stageId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        stageName: { anyOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }] }
        roundId: { $ref: '#/components/schemas/Uuid' }
        roundName: { $ref: '#/components/schemas/DisplayName' }
        matchIds: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/Uuid' } }
    ContentBatchSelection:
      description: Explicit sports selection of a content batch; the stage, when given, must be the round's stage.
      type: object
      required: [competitionId, seasonId, stageId, roundId, matchIds, kinds]
      additionalProperties: false
      properties:
        competitionId: { $ref: '#/components/schemas/Uuid' }
        seasonId: { $ref: '#/components/schemas/Uuid' }
        stageId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        roundId: { $ref: '#/components/schemas/Uuid' }
        matchIds: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        kinds: { type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: { type: string, enum: [round_results, match_result, round_calendar, upcoming_matches, match_preview] } }
        language: { $ref: '#/components/schemas/Language' }
    ContentBatchCreate:
      type: object
      required: [requestKey, selection]
      additionalProperties: false
      properties:
        requestKey: { $ref: '#/components/schemas/Uuid' }
        selection: { $ref: '#/components/schemas/ContentBatchSelection' }
    ContentBatchContext:
      type: object
      required: [competitionId, competitionName, seasonId, seasonLabel, stageId, stageName, roundId, roundName]
      additionalProperties: false
      properties:
        competitionId: { $ref: '#/components/schemas/Uuid' }
        competitionName: { $ref: '#/components/schemas/DisplayName' }
        seasonId: { $ref: '#/components/schemas/Uuid' }
        seasonLabel: { $ref: '#/components/schemas/DisplayName' }
        stageId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        stageName: { anyOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }] }
        roundId: { $ref: '#/components/schemas/Uuid' }
        roundName: { $ref: '#/components/schemas/DisplayName' }
    ContentBatchMatch:
      description: Selected match with its current effective local values; null/null scores are unknown, never 0-0.
      type: object
      required: [matchId, homeTeamName, awayTeamName, kickoffAt, status, homeScore, awayScore, ineligibility, calendarIneligibility, upcomingIneligibility]
      additionalProperties: false
      properties:
        matchId: { $ref: '#/components/schemas/Uuid' }
        homeTeamName: { $ref: '#/components/schemas/TeamName' }
        awayTeamName: { $ref: '#/components/schemas/TeamName' }
        kickoffAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
        status: { $ref: '#/components/schemas/CompetitionMatchStatus' }
        homeScore: { anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        awayScore: { anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        ineligibility: { anyOf: [{ type: string, enum: [not_finished, score_missing, kickoff_missing, team_name_not_supported] }, { type: 'null' }] }
        calendarIneligibility: { anyOf: [{ type: string, enum: [already_finished, not_upcoming, kickoff_missing, team_name_not_supported] }, { type: 'null' }] }
        upcomingIneligibility: { anyOf: [{ type: string, enum: [already_finished, not_upcoming, kickoff_missing, team_name_not_supported] }, { type: 'null' }] }
    ContentPiecePlan:
      type: object
      required: [position, kind, title, matchIds, status, skipReason]
      additionalProperties: false
      properties:
        position: { type: integer, minimum: 1 }
        kind: { type: string, enum: [round_results, match_result, round_calendar, upcoming_matches, match_preview] }
        title: { type: string, minLength: 1, maxLength: 200 }
        matchIds: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/Uuid' } }
        status: { type: string, enum: [ready, skipped] }
        skipReason: { anyOf: [{ type: string, enum: [not_finished, score_missing, kickoff_missing, team_name_not_supported, no_eligible_matches, context_not_supported, not_upcoming, already_finished] }, { type: 'null' }] }
    ContentBatchPreview:
      type: object
      required: [context, selectionLabel, language, matches, templates, pieces, totals]
      additionalProperties: false
      properties:
        context: { $ref: '#/components/schemas/ContentBatchContext' }
        selectionLabel: { anyOf: [{ $ref: '#/components/schemas/StageName' }, { type: 'null' }] }
        language: { $ref: '#/components/schemas/Language' }
        matches: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/ContentBatchMatch' } }
        templates: { type: array, items: { $ref: '#/components/schemas/Template' } }
        pieces: { type: array, items: { $ref: '#/components/schemas/ContentPiecePlan' } }
        totals:
          type: object
          required: [requested, ready, skipped]
          additionalProperties: false
          properties:
            requested: { type: integer, minimum: 0 }
            ready: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0 }
    ContentBatchItem:
      type: object
      required: [id, position, kind, title, matchIds, status, skipReason, failure, projectId, runId]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        position: { type: integer, minimum: 1 }
        kind: { type: string, enum: [round_results, match_result, round_calendar, upcoming_matches, match_preview] }
        title: { type: string, minLength: 1, maxLength: 200 }
        matchIds: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/Uuid' } }
        status: { type: string, enum: [skipped, pending, running, completed, failed, deleted] }
        skipReason: { anyOf: [{ type: string, enum: [not_finished, score_missing, kickoff_missing, team_name_not_supported, no_eligible_matches, context_not_supported, not_upcoming, already_finished] }, { type: 'null' }] }
        failure: { anyOf: [{ $ref: '#/components/schemas/Failure' }, { type: 'null' }] }
        projectId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        runId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    ContentBatch:
      type: object
      required: [id, requestKey, createdAt, context, language, state, totals, items]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        requestKey: { $ref: '#/components/schemas/Uuid' }
        createdAt: { type: string, format: date-time }
        context: { $ref: '#/components/schemas/ContentBatchContext' }
        language: { $ref: '#/components/schemas/Language' }
        state: { type: string, enum: [in_progress, completed, partial, failed] }
        totals:
          type: object
          required: [requested, generated, failed, skipped, pending, deleted]
          additionalProperties: false
          properties:
            requested: { type: integer, minimum: 0 }
            generated: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            skipped: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            deleted: { type: integer, minimum: 0 }
        items: { type: array, items: { $ref: '#/components/schemas/ContentBatchItem' } }
    RunStart:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [full, redraft] }
    Run:
      type: object
      required: [id, projectId, runNumber, kind, status, startedAt, finishedAt, failure, stages]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        runNumber: { type: integer }
        kind: { type: string, enum: [full, redraft] }
        status: { $ref: '#/components/schemas/RunStatus' }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        failure:
          oneOf:
            - $ref: '#/components/schemas/Failure'
            - type: 'null'
        stages:
          type: array
          items: { $ref: '#/components/schemas/StageStatus' }
    RunStatus:
      type: string
      enum: [pending, running, completed, failed]
    StageStatus:
      type: object
      required: [stage, status, startedAt, finishedAt, failure]
      additionalProperties: false
      properties:
        stage: { type: string, enum: [research, verification, content, rendering, visual_qa] }
        status: { type: string, enum: [pending, running, completed, failed, skipped] }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        failure:
          oneOf:
            - $ref: '#/components/schemas/Failure'
            - type: 'null'
    FactStatus:
      description: 'verified: two independent accepted sources agree (BR-01). unverified: every other fact, with unverifiedReason. manually_approved: operator-attested MANUAL_DATA fact, never verification (OD-17, R-070, R-071, R-433).'
      type: string
      enum: [verified, unverified, manually_approved]
    UnverifiedReason:
      description: Reason of an unverified fact (OD-17); null unless the status is unverified.
      type: [string, 'null']
      enum: [awaiting_independent_verification, disputed, no_accepted_source, team_identity_unmatched, null]
    BlockReason:
      description: Why a fact makes content not approvable for publication.
      type: string
      enum: [not_verified, manually_approved_not_publishable, publication_permission_unconfirmed]
    FactKind:
      type: string
      enum: [match_teams, match_kickoff, match_status, match_score, standing_row, matchday_info, context_item, team_official_name]
    FactRef:
      allOf:
        - $ref: '#/components/schemas/FactRefFields'
      unevaluatedProperties: false
    FactRefFields:
      description: Open base object; closed by the schemas that use it (unevaluatedProperties).
      type: object
      required: [factId, factKey, kind, status, unverifiedReason, reason, display]
      properties:
        factId: { $ref: '#/components/schemas/Uuid' }
        factKey: { type: string, maxLength: 200 }
        kind: { $ref: '#/components/schemas/FactKind' }
        status: { $ref: '#/components/schemas/FactStatus' }
        unverifiedReason: { $ref: '#/components/schemas/UnverifiedReason' }
        reason: { type: [string, 'null'], maxLength: 300, description: 'Built from fixed text and sanitized parameters' }
        display: { type: [string, 'null'], description: 'Deterministic display form of the verified value, or of the candidate value when one exists' }
        blockReason: { $ref: '#/components/schemas/BlockReason' }
    FactSubject:
      type: object
      additionalProperties: false
      properties:
        matchKey: { $ref: '#/components/schemas/MatchKey' }
        teamId: { $ref: '#/components/schemas/Slug' }
        contextIndex: { type: integer, minimum: 0 }
    MatchTeamsValue:
      type: object
      required: [homeTeamId, awayTeamId]
      additionalProperties: false
      properties:
        homeTeamId: { $ref: '#/components/schemas/Slug' }
        awayTeamId: { $ref: '#/components/schemas/Slug' }
    MatchKickoffValue:
      type: object
      required: [kickoff]
      additionalProperties: false
      properties:
        kickoff: { type: string, format: date-time }
    MatchStatusValue:
      type: object
      required: [matchStatus]
      additionalProperties: false
      properties:
        matchStatus: { $ref: '#/components/schemas/MatchStatus' }
    MatchScoreValue:
      type: object
      required: [home, away]
      additionalProperties: false
      properties:
        home: { type: integer, minimum: 0 }
        away: { type: integer, minimum: 0 }
    StandingRowValue:
      type: object
      required: [position, teamId, played, won, drawn, lost, goalsFor, goalsAgainst, goalDifference, points]
      additionalProperties: false
      properties:
        position: { type: integer, minimum: 1 }
        teamId: { $ref: '#/components/schemas/Slug' }
        played: { type: integer, minimum: 0 }
        won: { type: integer, minimum: 0 }
        drawn: { type: integer, minimum: 0 }
        lost: { type: integer, minimum: 0 }
        goalsFor: { type: integer, minimum: 0 }
        goalsAgainst: { type: integer, minimum: 0 }
        goalDifference: { type: integer }
        points: { type: integer }
    MatchdayInfoValue:
      type: object
      required: [stageLabel, matchdayNumber, totalMatchdays]
      additionalProperties: false
      properties:
        stageLabel: { $ref: '#/components/schemas/StageName' }
        matchdayNumber: { type: [integer, 'null'], minimum: 1 }
        totalMatchdays: { type: [integer, 'null'], minimum: 1 }
    ContextItemValue:
      oneOf:
        - type: object
          required: [type, matchday, totalMatchdays]
          additionalProperties: false
          properties:
            type: { const: matchday_of_total }
            matchday: { type: integer, minimum: 1 }
            totalMatchdays: { type: integer, minimum: 1 }
        - type: object
          required: [type, count]
          additionalProperties: false
          properties:
            type: { const: teams_in_table }
            count: { type: integer, minimum: 1 }
        - type: object
          required: [type, count]
          additionalProperties: false
          properties:
            type: { const: matches_in_selection }
            count: { type: integer, minimum: 0 }
    TeamOfficialNameValue:
      type: object
      required: [teamId, officialName]
      additionalProperties: false
      properties:
        teamId: { $ref: '#/components/schemas/Slug' }
        officialName: { $ref: '#/components/schemas/TeamName' }
    FactValue:
      description: Any closed fact value (used where the kind is given by the enclosing fact).
      oneOf:
        - $ref: '#/components/schemas/MatchTeamsValue'
        - $ref: '#/components/schemas/MatchKickoffValue'
        - $ref: '#/components/schemas/MatchStatusValue'
        - $ref: '#/components/schemas/MatchScoreValue'
        - $ref: '#/components/schemas/StandingRowValue'
        - $ref: '#/components/schemas/MatchdayInfoValue'
        - $ref: '#/components/schemas/ContextItemValue'
        - $ref: '#/components/schemas/TeamOfficialNameValue'
    FactKindValue:
      description: |
        The value schemas selected by the fact kind. value is set only when the fact is verified. candidateValue is the
        single consistent value of an unverified or manually approved fact (one accepted independence group, or MANUAL_DATA),
        null otherwise; content that uses a candidate value is not approvable unless the fact is publishable.
      oneOf:
        - { type: object, required: [kind, value, candidateValue], properties: { kind: { const: match_teams }, value: { oneOf: [ { $ref: '#/components/schemas/MatchTeamsValue' }, { type: 'null' } ] }, candidateValue: { oneOf: [ { $ref: '#/components/schemas/MatchTeamsValue' }, { type: 'null' } ] } } }
        - { type: object, required: [kind, value, candidateValue], properties: { kind: { const: match_kickoff }, value: { oneOf: [ { $ref: '#/components/schemas/MatchKickoffValue' }, { type: 'null' } ] }, candidateValue: { oneOf: [ { $ref: '#/components/schemas/MatchKickoffValue' }, { type: 'null' } ] } } }
        - { type: object, required: [kind, value, candidateValue], properties: { kind: { const: match_status }, value: { oneOf: [ { $ref: '#/components/schemas/MatchStatusValue' }, { type: 'null' } ] }, candidateValue: { oneOf: [ { $ref: '#/components/schemas/MatchStatusValue' }, { type: 'null' } ] } } }
        - { type: object, required: [kind, value, candidateValue], properties: { kind: { const: match_score }, value: { oneOf: [ { $ref: '#/components/schemas/MatchScoreValue' }, { type: 'null' } ] }, candidateValue: { oneOf: [ { $ref: '#/components/schemas/MatchScoreValue' }, { type: 'null' } ] } } }
        - { type: object, required: [kind, value, candidateValue], properties: { kind: { const: standing_row }, value: { oneOf: [ { $ref: '#/components/schemas/StandingRowValue' }, { type: 'null' } ] }, candidateValue: { oneOf: [ { $ref: '#/components/schemas/StandingRowValue' }, { type: 'null' } ] } } }
        - { type: object, required: [kind, value, candidateValue], properties: { kind: { const: matchday_info }, value: { oneOf: [ { $ref: '#/components/schemas/MatchdayInfoValue' }, { type: 'null' } ] }, candidateValue: { oneOf: [ { $ref: '#/components/schemas/MatchdayInfoValue' }, { type: 'null' } ] } } }
        - { type: object, required: [kind, value, candidateValue], properties: { kind: { const: context_item }, value: { oneOf: [ { $ref: '#/components/schemas/ContextItemValue' }, { type: 'null' } ] }, candidateValue: { oneOf: [ { $ref: '#/components/schemas/ContextItemValue' }, { type: 'null' } ] } } }
        - { type: object, required: [kind, value, candidateValue], properties: { kind: { const: team_official_name }, value: { oneOf: [ { $ref: '#/components/schemas/TeamOfficialNameValue' }, { type: 'null' } ] }, candidateValue: { oneOf: [ { $ref: '#/components/schemas/TeamOfficialNameValue' }, { type: 'null' } ] } } }
    ManualApproval:
      description: Audit view of the manual approval of a MANUAL_DATA fact (R-071, R-272).
      type: object
      required: [approvedAt, carriedOverFromFactId]
      additionalProperties: false
      properties:
        approvedAt: { type: string, format: date-time }
        carriedOverFromFactId:
          description: Set when an unchanged fact keeps the approval of the same fact of the previous run (R-068).
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    Fact:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/FactRefFields'
        - $ref: '#/components/schemas/FactKindValue'
        - type: object
          required: [subject, evidence, dispute, manualApproval]
          properties:
            subject: { $ref: '#/components/schemas/FactSubject' }
            evidence:
              type: array
              items: { $ref: '#/components/schemas/Evidence' }
            dispute:
              oneOf:
                - $ref: '#/components/schemas/Dispute'
                - type: 'null'
            manualApproval:
              oneOf:
                - $ref: '#/components/schemas/ManualApproval'
                - type: 'null'
    Evidence:
      type: object
      required: [sourceId, sourceName, dataMode, role, accepted, officialPublication, relation, value, sourceRef, retrievedAt, importVersionId]
      additionalProperties: false
      properties:
        sourceId: { $ref: '#/components/schemas/SourceId' }
        sourceName: { type: string, maxLength: 80 }
        dataMode: { $ref: '#/components/schemas/DataMode' }
        role: { type: string, enum: [primary, verification] }
        accepted: { type: boolean }
        officialPublication: { type: boolean }
        relation: { type: string, enum: [supports, disagrees, consulted] }
        value: { $ref: '#/components/schemas/FactValue' }
        sourceRef: { type: string, maxLength: 512, description: 'Provider-neutral attribution reference, for example source:<sourceId>/<resourceKind>@<retrievedAt>, fixture:<scenario>/<file> or import:<importId>/v<n>; never a URL, never a provider identifier or base URL, never a credential; shown as text only (T10-F16, T11H-F14)' }
        retrievedAt: { type: string, format: date-time }
        importVersionId:
          description: MANUAL_DATA version the value comes from (R-067, R-277); null for other modes.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    Dispute:
      type: object
      required: [sourceValues, consultedSourceId, consultedAt, outcome, resolvedValue]
      additionalProperties: false
      properties:
        sourceValues:
          type: array
          items:
            type: object
            required: [sourceId, independenceGroup, value]
            additionalProperties: false
            properties:
              sourceId: { $ref: '#/components/schemas/SourceId' }
              independenceGroup: { type: string, maxLength: 64 }
              value: { $ref: '#/components/schemas/FactValue' }
        consultedSourceId:
          oneOf:
            - $ref: '#/components/schemas/SourceId'
            - type: 'null'
        consultedAt: { type: [string, 'null'], format: date-time }
        outcome: { type: string, enum: [resolved, unavailable, same_source, no_match] }
        resolvedValue:
          oneOf:
            - $ref: '#/components/schemas/FactValue'
            - type: 'null'
    StandingsAvailability:
      description: Whether the selection has standings (R-077, R-254, R-284); never derived when missing.
      type: object
      required: [available, reason]
      additionalProperties: false
      properties:
        available: { type: boolean }
        reason:
          type: [string, 'null']
          enum: [not_provided_for_stage, not_provided_by_source, not_available_with_subscription, null]
    LeftOutMatch:
      type: object
      required: [matchKey, label, status, reason]
      additionalProperties: false
      properties:
        matchKey: { $ref: '#/components/schemas/MatchKey' }
        label: { type: string, maxLength: 200 }
        status:
          oneOf:
            - $ref: '#/components/schemas/MatchStatus'
            - type: 'null'
        reason: { type: string, enum: [not_finished, not_verified, excluded_by_operator, already_finished, not_upcoming] }
    Draft:
      type: object
      required: [id, projectId, runId, factsRunId, language, dataMode, demonstration, standingsIncluded, createdAt, excludedMatchKeys, leftOutMatches, carousels]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        runId: { $ref: '#/components/schemas/Uuid' }
        factsRunId: { $ref: '#/components/schemas/Uuid' }
        language: { $ref: '#/components/schemas/Language' }
        dataMode: { $ref: '#/components/schemas/DataMode' }
        demonstration: { type: boolean }
        standingsIncluded: { type: boolean, description: 'False when the selection has no standings; the carousel then has no standings slide (R-285)' }
        createdAt: { type: string, format: date-time }
        excludedMatchKeys:
          type: array
          items: { $ref: '#/components/schemas/MatchKey' }
        leftOutMatches:
          type: array
          items: { $ref: '#/components/schemas/LeftOutMatch' }
        carousels:
          type: array
          items: { $ref: '#/components/schemas/Carousel' }
    Carousel:
      type: object
      required: [id, sequence, total, elements, readyForFinalApproval, finalApproval]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        sequence: { type: integer }
        total: { type: integer }
        elements:
          type: array
          items: { $ref: '#/components/schemas/Element' }
        readyForFinalApproval: { type: boolean }
        finalApproval:
          oneOf:
            - $ref: '#/components/schemas/FinalApproval'
            - type: 'null'
    Element:
      type: object
      required: [id, carouselId, kind, position, slideType, currentVersion]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        carouselId: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [slide, caption] }
        position: { type: integer }
        slideType: { type: [string, 'null'], enum: [cover, match_result, standings, closing, round_overview, fixture, match_preview, null] }
        currentVersion: { $ref: '#/components/schemas/ElementVersion' }
    ElementVersion:
      type: object
      required: [id, versionNumber, createdAt, state, blocked, blockingFacts, contentFlags, qa, fields, imageUrl, width, height]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        versionNumber: { type: integer }
        createdAt: { type: string, format: date-time }
        state: { type: string, enum: [pending_qa, qa_failed, ready, approved, superseded] }
        blocked: { type: boolean, description: 'True when a referenced fact is not publishable (R-026, R-271, R-272)' }
        blockingFacts:
          type: array
          items: { $ref: '#/components/schemas/FactRef' }
        contentFlags:
          type: array
          items: { $ref: '#/components/schemas/ContentFlag' }
        qa:
          type: array
          items: { $ref: '#/components/schemas/QaResult' }
        fields:
          type: array
          items: { $ref: '#/components/schemas/TextField' }
        imageUrl: { type: [string, 'null'], maxLength: 200, description: 'Relative API path of the slide image' }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
    TextField:
      type: object
      required: [field, segments]
      additionalProperties: false
      properties:
        field: { type: string, enum: [headline, description, caption, hashtags, title, score, team_home, team_away, kickoff, standings, footer, demo_label, match_status, fixtures] }
        segments:
          type: array
          items:
            type: object
            required: [provenance, text, factId, factStatus]
            additionalProperties: false
            properties:
              provenance: { type: string, enum: [fact, commentary, template_text], description: 'OD-01, R-028, R-208; a fact segment shows the current status of its fact' }
              text: { type: string, maxLength: 2200 }
              factId:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
              factStatus:
                oneOf:
                  - $ref: '#/components/schemas/FactStatus'
                  - type: 'null'
    ContentFlag:
      type: object
      required: [code, field, excerpt]
      additionalProperties: false
      properties:
        code: { type: string, enum: [UNKNOWN_FACT_REFERENCE, UNVERIFIED_NUMBER, NON_OFFICIAL_TEAM_NAME, FORBIDDEN_CONTENT, UNPLAYED_RESULT_CLAIM] }
        field: { type: string, maxLength: 40 }
        excerpt: { type: string, maxLength: 120 }
    QaResult:
      description: One QA check result; details are closed per check (T10-F17).
      oneOf:
        - type: object
          required: [check, outcome, severity, details, acknowledgedAt]
          additionalProperties: false
          properties:
            check: { const: data_match }
            outcome: { $ref: '#/components/schemas/QaOutcome' }
            severity: { const: blocking }
            details:
              type: object
              required: [mismatches]
              additionalProperties: false
              properties:
                mismatches:
                  type: array
                  items: { $ref: '#/components/schemas/QaMismatch' }
            acknowledgedAt: { type: 'null' }
        - type: object
          required: [check, outcome, severity, details, acknowledgedAt]
          additionalProperties: false
          properties:
            check: { const: team_names }
            outcome: { $ref: '#/components/schemas/QaOutcome' }
            severity: { const: blocking }
            details:
              type: object
              required: [mismatches]
              additionalProperties: false
              properties:
                mismatches:
                  type: array
                  items: { $ref: '#/components/schemas/QaMismatch' }
            acknowledgedAt: { type: 'null' }
        - type: object
          required: [check, outcome, severity, details, acknowledgedAt]
          additionalProperties: false
          properties:
            check: { const: text_fit }
            outcome: { $ref: '#/components/schemas/QaOutcome' }
            severity: { const: blocking }
            details:
              type: object
              required: [overflowingElements]
              additionalProperties: false
              properties:
                overflowingElements:
                  type: array
                  items: { type: string, maxLength: 64 }
            acknowledgedAt: { type: 'null' }
        - type: object
          required: [check, outcome, severity, details, acknowledgedAt]
          additionalProperties: false
          properties:
            check: { const: style_consistency }
            outcome: { $ref: '#/components/schemas/QaOutcome' }
            severity: { const: warning }
            details:
              type: object
              required: [colorsOutsidePalette, fontsOutsideSet, templateVersions]
              additionalProperties: false
              properties:
                colorsOutsidePalette:
                  type: array
                  items: { type: string, pattern: '^#[0-9a-f]{6}$' }
                fontsOutsideSet:
                  type: array
                  items: { type: string, maxLength: 64 }
                templateVersions:
                  type: array
                  items: { type: string, maxLength: 64 }
            acknowledgedAt: { type: [string, 'null'], format: date-time }
        - type: object
          required: [check, outcome, severity, details, acknowledgedAt]
          additionalProperties: false
          properties:
            check: { const: dimensions }
            outcome: { $ref: '#/components/schemas/QaOutcome' }
            severity: { const: blocking }
            details:
              type: object
              required: [expectedWidth, expectedHeight, actualWidth, actualHeight]
              additionalProperties: false
              properties:
                expectedWidth: { type: integer }
                expectedHeight: { type: integer }
                actualWidth: { type: integer }
                actualHeight: { type: integer }
            acknowledgedAt: { type: 'null' }
        - description: Capitalized tokens in the AI-written text that are not verified team or competition names, the language word list or the brand terms, for example possible person names (OD-26, T11H-F17). Warning, acknowledged like style_consistency.
          type: object
          required: [check, outcome, severity, details, acknowledgedAt]
          additionalProperties: false
          properties:
            check: { const: capitalized_tokens }
            outcome: { $ref: '#/components/schemas/QaOutcome' }
            severity: { const: warning }
            details:
              type: object
              required: [tokens]
              additionalProperties: false
              properties:
                tokens:
                  type: array
                  items: { type: string, maxLength: 64 }
            acknowledgedAt: { type: [string, 'null'], format: date-time }
    QaOutcome:
      type: string
      enum: [pass, fail]
    QaMismatch:
      type: object
      required: [elementId, factId, expected, actual]
      additionalProperties: false
      properties:
        elementId: { type: string, maxLength: 64 }
        factId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        expected: { type: string, maxLength: 200 }
        actual: { type: string, maxLength: 200 }
    VersionRef:
      type: object
      required: [versionId]
      additionalProperties: false
      properties:
        versionId: { $ref: '#/components/schemas/Uuid' }
    FinalApproval:
      type: object
      required: [id, carouselId, approvedAt, versionSetSha256, valid]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        carouselId: { $ref: '#/components/schemas/Uuid' }
        approvedAt: { type: string, format: date-time }
        versionSetSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        valid: { type: boolean }
    Export:
      allOf:
        - $ref: '#/components/schemas/ExportFields'
      unevaluatedProperties: false
    ExportFields:
      description: Open base object; closed by the schemas that use it (unevaluatedProperties).
      type: object
      required: [id, projectId, carouselId, finalApprovalId, exportedAt, directory, dataMode, demonstration, files]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        carouselId: { $ref: '#/components/schemas/Uuid' }
        finalApprovalId: { $ref: '#/components/schemas/Uuid' }
        exportedAt: { type: string, format: date-time }
        directory: { type: string, maxLength: 200, description: 'Path relative to the data directory' }
        dataMode: { $ref: '#/components/schemas/DataMode' }
        demonstration: { type: boolean, description: 'True for DEMO_DATA content; also stated in manifest.json and on the slides (OD-21)' }
        files:
          type: array
          items:
            type: object
            required: [position, fileName, kind, sha256, elementVersionId]
            additionalProperties: false
            properties:
              position: { type: integer }
              fileName: { type: string, pattern: '^([0-9]{2}\.png|caption\.txt|manifest\.json)$' }
              kind: { type: string, enum: [slide_image, caption_text, manifest] }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              elementVersionId:
                oneOf:
                  - $ref: '#/components/schemas/Uuid'
                  - type: 'null'
    ExportDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/ExportFields'
        - type: object
          required: [elements]
          properties:
            elements:
              description: The exact element versions that were exported, in carousel order.
              type: array
              items:
                type: object
                required: [position, kind, version]
                additionalProperties: false
                properties:
                  position: { type: integer }
                  kind: { type: string, enum: [slide, caption] }
                  version: { $ref: '#/components/schemas/ElementVersion' }
    SlideTrace:
      type: object
      required: [exportId, position, elementVersionId, dataMode, facts]
      additionalProperties: false
      properties:
        exportId: { $ref: '#/components/schemas/Uuid' }
        position: { type: integer }
        elementVersionId: { $ref: '#/components/schemas/Uuid' }
        dataMode: { $ref: '#/components/schemas/DataMode' }
        facts:
          type: array
          items: { $ref: '#/components/schemas/Fact' }
    ImportCreate:
      description: 'One import request; channel json_file or csv_file sends the exact file bytes base64-encoded (T11H-F01), channel form sends the document built by the web form (R-057, R-319).'
      oneOf:
        - $ref: '#/components/schemas/ImportFileCreate'
        - $ref: '#/components/schemas/ImportFormCreate'
    ImportFileCreate:
      type: object
      required: [channel, fileName, declaredSource, contentBase64]
      additionalProperties: false
      properties:
        channel: { type: string, enum: [json_file, csv_file] }
        fileName: { $ref: '#/components/schemas/FileName' }
        declaredSource:
          oneOf:
            - $ref: '#/components/schemas/Label'
            - type: 'null'
        contentBase64:
          description: 'The exact bytes of the file, standard base64 (RFC 4648 section 4, padded, no line breaks). At most 512 KiB of decoded bytes (699052 base64 characters). The server decodes it strictly, refuses invalid UTF-8 as encoding_invalid, and preserves and hashes the received bytes unchanged (T11H-F01).'
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 699052
          pattern: '^[A-Za-z0-9+/]*={0,2}$'
    ImportFormCreate:
      type: object
      required: [channel, declaredSource, document]
      additionalProperties: false
      properties:
        channel: { type: string, const: form }
        declaredSource:
          oneOf:
            - $ref: '#/components/schemas/Label'
            - type: 'null'
        document: { $ref: '#/components/schemas/ManualImportDocument' }
    ManualImportDocument:
      description: The one normalized import format of every MANUAL_DATA channel (R-060, R-064, R-065, R-434). Person-level fields do not exist and are refused (R-119).
      type: object
      required: [format, competition, season, selections]
      additionalProperties: false
      properties:
        format: { type: string, const: edr-manual-import/1 }
        competition:
          type: object
          required: [id, name, areaName]
          additionalProperties: false
          properties:
            id: { $ref: '#/components/schemas/Slug' }
            name: { $ref: '#/components/schemas/DisplayName' }
            areaName:
              oneOf:
                - $ref: '#/components/schemas/DisplayName'
                - type: 'null'
        season:
          type: object
          required: [id, label]
          additionalProperties: false
          properties:
            id: { $ref: '#/components/schemas/Slug' }
            label: { $ref: '#/components/schemas/DisplayName' }
        selections:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ManualSelection' }
    ManualSelection:
      type: object
      required: [stage, matchday, teams, matches, standings]
      additionalProperties: false
      properties:
        stage:
          type: object
          required: [id, name, order]
          additionalProperties: false
          properties:
            id: { $ref: '#/components/schemas/Slug' }
            name: { $ref: '#/components/schemas/StageName' }
            order: { type: integer, minimum: 1, maximum: 99 }
        matchday: { type: [integer, 'null'], minimum: 1, maximum: 999 }
        teams:
          type: array
          minItems: 2
          maxItems: 64
          items:
            type: object
            required: [key, name]
            additionalProperties: false
            properties:
              key: { $ref: '#/components/schemas/Slug' }
              name: { $ref: '#/components/schemas/TeamName' }
        matches:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            required: [home, away, kickoff, status, score]
            additionalProperties: false
            properties:
              home: { $ref: '#/components/schemas/Slug' }
              away: { $ref: '#/components/schemas/Slug' }
              kickoff: { type: string, format: date-time, maxLength: 40 }
              status: { $ref: '#/components/schemas/MatchStatus' }
              score:
                oneOf:
                  - type: object
                    required: [home, away]
                    additionalProperties: false
                    properties:
                      home: { type: integer, minimum: 0, maximum: 99 }
                      away: { type: integer, minimum: 0, maximum: 99 }
                  - type: 'null'
        standings:
          oneOf:
            - type: object
              required: [asOf, rows]
              additionalProperties: false
              properties:
                asOf: { type: string, format: date-time, maxLength: 40 }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    type: object
                    required: [position, team, played, won, drawn, lost, goalsFor, goalsAgainst, goalDifference, points]
                    additionalProperties: false
                    properties:
                      position: { type: integer, minimum: 1, maximum: 64 }
                      team: { $ref: '#/components/schemas/Slug' }
                      played: { type: integer, minimum: 0, maximum: 999 }
                      won: { type: integer, minimum: 0, maximum: 999 }
                      drawn: { type: integer, minimum: 0, maximum: 999 }
                      lost: { type: integer, minimum: 0, maximum: 999 }
                      goalsFor: { type: integer, minimum: 0, maximum: 999 }
                      goalsAgainst: { type: integer, minimum: 0, maximum: 999 }
                      goalDifference: { type: integer, minimum: -999, maximum: 999 }
                      points: { type: integer, minimum: -999, maximum: 999 }
            - type: 'null'
    ImportError:
      type: object
      required: [location, record, field, problem, message]
      additionalProperties: false
      properties:
        location: { type: string, enum: [file, form] }
        record: { type: string, maxLength: 120, description: 'Row number (CSV), JSON pointer (JSON, form) or "file"' }
        field: { type: [string, 'null'], maxLength: 80, description: 'Column or field name, sanitized; for a refused person-level column its header name' }
        problem:
          type: string
          enum: [parse_error, encoding_invalid, too_large, too_many_rows, header_invalid, column_unknown, person_field, required_missing, type_invalid, value_out_of_range, value_inconsistent, duplicate_match, unknown_team, metadata_missing, metadata_conflict, finished_without_score, score_not_allowed]
        message: { type: string, maxLength: 200, description: 'Fixed text plus sanitized parameters only' }
    ImportSummary:
      type: object
      required: [id, channel, fileName, declaredSource, receivedAt, competitionId, competitionName, seasonId, seasonLabel, originalSha256, selections]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        channel: { type: string, enum: [json_file, csv_file, form] }
        fileName:
          oneOf:
            - $ref: '#/components/schemas/FileName'
            - type: 'null'
        declaredSource:
          oneOf:
            - $ref: '#/components/schemas/Label'
            - type: 'null'
        receivedAt: { type: string, format: date-time }
        competitionId: { $ref: '#/components/schemas/Slug' }
        competitionName: { $ref: '#/components/schemas/DisplayName' }
        seasonId: { $ref: '#/components/schemas/Slug' }
        seasonLabel: { $ref: '#/components/schemas/DisplayName' }
        originalSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        selections:
          type: array
          items:
            type: object
            required: [stageId, stageName, matchday, versionId, versionNumber]
            additionalProperties: false
            properties:
              stageId: { $ref: '#/components/schemas/Slug' }
              stageName: { $ref: '#/components/schemas/StageName' }
              matchday: { type: [integer, 'null'] }
              versionId: { $ref: '#/components/schemas/Uuid' }
              versionNumber: { type: integer, minimum: 1 }
    ManualSelectionHistory:
      type: object
      required: [competitionId, seasonId, selections]
      additionalProperties: false
      properties:
        competitionId: { $ref: '#/components/schemas/Slug' }
        seasonId: { $ref: '#/components/schemas/Slug' }
        selections:
          type: array
          items:
            type: object
            required: [stageId, stageName, matchday, versions]
            additionalProperties: false
            properties:
              stageId: { $ref: '#/components/schemas/Slug' }
              stageName: { $ref: '#/components/schemas/StageName' }
              matchday: { type: [integer, 'null'] }
              versions:
                type: array
                items:
                  type: object
                  required: [versionId, versionNumber, importId, createdAt, current]
                  additionalProperties: false
                  properties:
                    versionId: { $ref: '#/components/schemas/Uuid' }
                    versionNumber: { type: integer, minimum: 1 }
                    importId: { $ref: '#/components/schemas/Uuid' }
                    createdAt: { type: string, format: date-time }
                    current: { type: boolean }
    ManualVersion:
      type: object
      required: [id, versionNumber, importId, createdAt, supersededAt, competitionId, seasonId, selection]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        versionNumber: { type: integer, minimum: 1 }
        importId: { $ref: '#/components/schemas/Uuid' }
        createdAt: { type: string, format: date-time }
        supersededAt: { type: [string, 'null'], format: date-time }
        competitionId: { $ref: '#/components/schemas/Slug' }
        seasonId: { $ref: '#/components/schemas/Slug' }
        selection: { $ref: '#/components/schemas/ManualSelection' }
    BrandAssetKind:
      type: string
      enum: [brand_logo, mascot, decoration, background, style_reference]
    BrandAsset:
      type: object
      required:
        [
          id,
          kind,
          label,
          description,
          mime,
          width,
          height,
          byteSize,
          sha256,
          usagePolicy,
          official,
          primary,
          variant,
          pose,
          expression,
          active,
          registeredAt,
          updatedAt,
        ]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/BrandAssetKind' }
        label: { $ref: '#/components/schemas/Label' }
        description: { oneOf: [{ type: string, minLength: 1, maxLength: 500, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
        mime: { type: string, enum: [image/png, image/jpeg, image/webp] }
        width: { type: integer }
        height: { type: integer }
        byteSize: { type: [integer, 'null'] }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        usagePolicy: { $ref: '#/components/schemas/BrandAssetUsagePolicy' }
        official: { type: boolean }
        primary: { type: boolean }
        variant: { oneOf: [{ $ref: '#/components/schemas/Label' }, { type: 'null' }] }
        pose: { oneOf: [{ $ref: '#/components/schemas/Label' }, { type: 'null' }] }
        expression: { oneOf: [{ $ref: '#/components/schemas/Label' }, { type: 'null' }] }
        active: { type: boolean }
        registeredAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BrandAssetUsagePolicy:
      type: string
      description: >-
        protected: used as is (scaled and positioned only); reference_only: style reference, never placed in content;
        reusable: placed directly in compositions; transformable: may be the base of AI variants (explicit).
      enum: [protected, reference_only, reusable, transformable]
    BrandAssetUsage:
      description: |
        Where an asset has been used: rendered slide versions, their projects and the exports holding them, and the
        visual templates (not deleted) whose versions place it (PD-ARCH-01G-C).
      type: object
      required: [renderedVersions, projects, exports, templates]
      additionalProperties: false
      properties:
        renderedVersions: { type: integer, minimum: 0 }
        projects: { type: integer, minimum: 0 }
        exports: { type: integer, minimum: 0 }
        templates: { type: integer, minimum: 0 }
    BrandAssetDetail:
      type: object
      required: [asset, usage]
      additionalProperties: false
      properties:
        asset: { $ref: '#/components/schemas/BrandAsset' }
        usage: { $ref: '#/components/schemas/BrandAssetUsage' }
    BrandIdentity:
      type: object
      required: [id, name, handle, mascotName, provisional, description, graphicPreferences, palette, typography, updatedAt]
      additionalProperties: false
      properties:
        id: { type: string, const: primary }
        name: { type: string, minLength: 1, maxLength: 80 }
        handle: { type: string, minLength: 1, maxLength: 80 }
        mascotName: { type: [string, 'null'], minLength: 1, maxLength: 80 }
        provisional: { type: boolean }
        description: { oneOf: [{ type: string, minLength: 1, maxLength: 1000, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
        graphicPreferences: { oneOf: [{ type: string, minLength: 1, maxLength: 2000, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
        palette:
          type: array
          items:
            type: object
            required: [role, value, usage]
            additionalProperties: false
            properties:
              role: { type: string, enum: [primary, primaryDark, accent, secondary, light] }
              value: { type: string, pattern: '^#[0-9a-f]{6}$' }
              usage: { oneOf: [{ type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
        typography:
          type: array
          items:
            type: object
            required: [role, family, weight, usage]
            additionalProperties: false
            properties:
              role: { type: string, enum: [heading, body, numeric] }
              family: { type: string, minLength: 1, maxLength: 80 }
              weight: { type: integer, minimum: 100, maximum: 900 }
              usage: { oneOf: [{ type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
        updatedAt: { type: [string, 'null'], format: date-time }
    Template:
      type: object
      required: [id, version, slideType, label, badgeSlots, imageSlots]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Slug' }
        version: { type: string, maxLength: 32 }
        slideType: { type: string, enum: [cover, match_result, standings, closing, round_overview, fixture, match_preview] }
        label: { type: string }
        badgeSlots: { type: integer, description: 'Reserved badge slots; empty while no authorized badge exists (R-050)' }
        imageSlots:
          type: array
          items: { $ref: '#/components/schemas/BrandAssetKind' }
    DesignMode:
      description: |
        How the prompt is made: `guided` (the server's versioned prompt, a background design with empty data zones and
        no text or people, reusable by a structured template) or `own_prompt` (the operator's prompt as written, with
        only the input-image numbering and the zones of original layers added; an inspiration image, never a template
        base).
      type: string
      enum: [guided, own_prompt]
    DesignContentType:
      description: Content a design proposal is made for (PD-ARCH-01G-B).
      type: string
      enum: [match_preview, round_overview, fixture, match_result]
    DesignFormat:
      type: string
      enum: ['1:1', '4:5', '9:16']
    DesignReferenceRole:
      description: |
        How a brand asset takes part in a generation: `style_reference` (its image is sent as a visual reference),
        `transform_base` (its image is the base of a variant; `transformable` assets only) or `reserved_placement` (never
        sent; the design leaves a clean zone where the original is placed later).
      type: string
      enum: [style_reference, transform_base, reserved_placement]
    DesignGenerationStatus:
      description: The statuses the server records while it works; no progress percentage is invented.
      type: string
      enum: [queued, preparing_references, sending_request, generating, saving, completed, failed]
    DesignProposalStatus:
      type: string
      enum: [pending_review, approved, rejected, changes_requested]
    DesignGenerationErrorCode:
      type: string
      enum:
        - NOT_CONFIGURED
        - API_KEY_MISSING
        - MODEL_UNAVAILABLE
        - ACCOUNT_NOT_AUTHORIZED
        - RATE_LIMITED
        - QUOTA_EXCEEDED
        - PROVIDER_REJECTED
        - INVALID_REQUEST
        - TIMEOUT
        - RESPONSE_INVALID
        - PROVIDER_UNAVAILABLE
        - PROVIDER_BUSY
        - STORAGE_FAILED
        - REFERENCE_UNAVAILABLE
        - INTERRUPTED
        - INTERNAL
    DesignPricing:
      description: Prices per million tokens as configured from the provider's published price list, with its source and date.
      type: object
      required:
        [currency, textInputPerMillionTokens, imageInputPerMillionTokens, imageOutputPerMillionTokens, textOutputPerMillionTokens, source, checkedOn]
      additionalProperties: false
      properties:
        currency: { type: string, const: USD }
        textInputPerMillionTokens: { type: number, minimum: 0, maximum: 100000 }
        imageInputPerMillionTokens: { type: number, minimum: 0, maximum: 100000 }
        imageOutputPerMillionTokens: { type: number, minimum: 0, maximum: 100000 }
        textOutputPerMillionTokens: { type: [number, 'null'], minimum: 0, maximum: 100000 }
        source: { type: string, minLength: 1, maxLength: 300 }
        checkedOn: { type: string, format: date }
    DesignModel:
      type: object
      required: [id, label, flexibleSizes, qualities, pricing, estimable]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9._-]{0,99}$' }
        label: { $ref: '#/components/schemas/Label' }
        flexibleSizes: { type: boolean }
        qualities:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 2, maxLength: 16, pattern: '^[a-z]{2,16}$' }
        pricing: { oneOf: [{ $ref: '#/components/schemas/DesignPricing' }, { type: 'null' }] }
        estimable: { type: boolean }
    DesignCapabilities:
      type: object
      required: [adapter, status, defaultModel, models, contentTypes, formats, policyRoles, limits, promptVersion]
      additionalProperties: false
      properties:
        adapter: { type: string, enum: [disabled, openai] }
        status: { type: string, enum: [disabled, missing_api_key, ready] }
        defaultModel: { oneOf: [{ type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9._-]{0,99}$' }, { type: 'null' }] }
        models:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/DesignModel' }
        contentTypes:
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/DesignContentType' }
        formats:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/DesignFormat' }
        policyRoles:
          type: array
          maxItems: 4
          items:
            type: object
            required: [policy, roles]
            additionalProperties: false
            properties:
              policy: { $ref: '#/components/schemas/BrandAssetUsagePolicy' }
              roles:
                type: array
                maxItems: 3
                items: { $ref: '#/components/schemas/DesignReferenceRole' }
        limits:
          type: object
          required:
            [maxImagesPerRequest, maxReferences, maxImagesPerDay, imagesUsedToday, monthlySpendLimit, spentThisMonth, maxConcurrentRequests]
          additionalProperties: false
          properties:
            maxImagesPerRequest: { type: integer, minimum: 1, maximum: 8 }
            maxReferences: { type: integer, minimum: 0, maximum: 8 }
            maxImagesPerDay: { type: integer, minimum: 1, maximum: 500 }
            imagesUsedToday: { type: integer, minimum: 0 }
            monthlySpendLimit: { type: [number, 'null'], minimum: 0, maximum: 100000 }
            spentThisMonth: { type: [number, 'null'], minimum: 0, maximum: 100000 }
            maxConcurrentRequests: { type: integer, minimum: 1, maximum: 4 }
        promptVersion: { type: string, minLength: 1, maxLength: 64 }
    DesignGenerationInput:
      description: What to generate; a generation adds the request key and the cost confirmation.
      type: object
      required: [contentType, format, quality, count, references]
      additionalProperties: false
      properties:
        mode: { $ref: '#/components/schemas/DesignMode' }
        contentType: { $ref: '#/components/schemas/DesignContentType' }
        format: { $ref: '#/components/schemas/DesignFormat' }
        model: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9._-]{0,99}$' }
        quality: { type: string, minLength: 2, maxLength: 16, pattern: '^[a-z]{2,16}$' }
        count: { type: integer, minimum: 1, maximum: 8 }
        style: { type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }
        instructions: { type: string, minLength: 1, maxLength: 12000, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }
        references:
          type: array
          maxItems: 8
          items:
            type: object
            required: [assetId, role]
            additionalProperties: false
            properties:
              assetId: { $ref: '#/components/schemas/Uuid' }
              role: { $ref: '#/components/schemas/DesignReferenceRole' }
        parentProposalId: { $ref: '#/components/schemas/Uuid' }
    DesignGenerationCreate:
      type: object
      required: [contentType, format, quality, count, references, requestKey, confirmCost]
      additionalProperties: false
      properties:
        mode: { $ref: '#/components/schemas/DesignMode' }
        contentType: { $ref: '#/components/schemas/DesignContentType' }
        format: { $ref: '#/components/schemas/DesignFormat' }
        model: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9._-]{0,99}$' }
        quality: { type: string, minLength: 2, maxLength: 16, pattern: '^[a-z]{2,16}$' }
        count: { type: integer, minimum: 1, maximum: 8 }
        style: { type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }
        instructions: { type: string, minLength: 1, maxLength: 12000, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }
        references:
          type: array
          maxItems: 8
          items:
            type: object
            required: [assetId, role]
            additionalProperties: false
            properties:
              assetId: { $ref: '#/components/schemas/Uuid' }
              role: { $ref: '#/components/schemas/DesignReferenceRole' }
        parentProposalId: { $ref: '#/components/schemas/Uuid' }
        requestKey: { $ref: '#/components/schemas/Uuid' }
        confirmCost: { type: boolean, const: true }
    DesignReference:
      type: object
      required: [assetId, label, kind, usagePolicy, role, sent]
      additionalProperties: false
      properties:
        assetId: { $ref: '#/components/schemas/Uuid' }
        label: { $ref: '#/components/schemas/Label' }
        kind: { $ref: '#/components/schemas/BrandAssetKind' }
        usagePolicy: { $ref: '#/components/schemas/BrandAssetUsagePolicy' }
        role: { $ref: '#/components/schemas/DesignReferenceRole' }
        sent: { type: boolean }
    DesignCostEstimate:
      description: An estimate from a published per-image output cost, or `unavailable`; never a final cost.
      type: object
      required: [status, currency, perImage, total, basis, pricingSource, pricingCheckedOn]
      additionalProperties: false
      properties:
        status: { type: string, enum: [estimated, unavailable] }
        currency: { oneOf: [{ type: string, const: USD }, { type: 'null' }] }
        perImage: { type: [number, 'null'], minimum: 0, maximum: 100000 }
        total: { type: [number, 'null'], minimum: 0, maximum: 100000 }
        basis: { type: string, enum: [published_output_cost, none] }
        pricingSource: { type: [string, 'null'], minLength: 1, maxLength: 300 }
        pricingCheckedOn: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
    DesignEstimate:
      type: object
      required:
        [provider, mode, model, quality, count, requestSize, outputWidth, outputHeight, adaptation, references, prompt, promptVersion, cost, imagesUsedToday, maxImagesPerDay, spentThisMonth, monthlySpendLimit]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [openai] }
        mode: { $ref: '#/components/schemas/DesignMode' }
        model: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9._-]{0,99}$' }
        quality: { type: string, minLength: 2, maxLength: 16, pattern: '^[a-z]{2,16}$' }
        count: { type: integer, minimum: 1, maximum: 8 }
        requestSize: { type: string, minLength: 5, maxLength: 9, pattern: '^[1-9][0-9]{1,3}x[1-9][0-9]{1,3}$' }
        outputWidth: { type: integer, minimum: 1, maximum: 4096 }
        outputHeight: { type: integer, minimum: 1, maximum: 4096 }
        adaptation: { type: string, enum: [none, center_crop] }
        references:
          type: array
          maxItems: 9
          items: { $ref: '#/components/schemas/DesignReference' }
        prompt: { type: string, minLength: 1, maxLength: 32000 }
        promptVersion: { type: string, minLength: 1, maxLength: 64 }
        cost: { $ref: '#/components/schemas/DesignCostEstimate' }
        imagesUsedToday: { type: integer, minimum: 0 }
        maxImagesPerDay: { type: integer, minimum: 1, maximum: 500 }
        spentThisMonth: { type: [number, 'null'], minimum: 0, maximum: 100000 }
        monthlySpendLimit: { type: [number, 'null'], minimum: 0, maximum: 100000 }
    DesignGeneration:
      type: object
      required:
        [id, mode, status, contentType, format, model, quality, requestedCount, completedCount, currentIndex, parentProposalId, proposalIds, errorCode, errorMessage, retryAfterSeconds, cost, createdAt, startedAt, updatedAt, completedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mode: { $ref: '#/components/schemas/DesignMode' }
        status: { $ref: '#/components/schemas/DesignGenerationStatus' }
        contentType: { $ref: '#/components/schemas/DesignContentType' }
        format: { $ref: '#/components/schemas/DesignFormat' }
        model: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9._-]{0,99}$' }
        quality: { type: string, minLength: 2, maxLength: 16, pattern: '^[a-z]{2,16}$' }
        requestedCount: { type: integer, minimum: 1, maximum: 8 }
        completedCount: { type: integer, minimum: 0, maximum: 8 }
        currentIndex: { type: [integer, 'null'], minimum: 1, maximum: 8 }
        parentProposalId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        proposalIds:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/Uuid' }
        errorCode: { oneOf: [{ $ref: '#/components/schemas/DesignGenerationErrorCode' }, { type: 'null' }] }
        errorMessage: { type: [string, 'null'], minLength: 1, maxLength: 300 }
        retryAfterSeconds: { type: [integer, 'null'], minimum: 0 }
        cost: { type: [number, 'null'], minimum: 0, maximum: 100000 }
        createdAt: { type: string, format: date-time }
        startedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        updatedAt: { type: string, format: date-time }
        completedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
    DesignGenerationEvent:
      description: One event of the SSE stream of a generation.
      type: object
      required: [id, type, generationId, status, imageIndex, proposalId, timestamp]
      additionalProperties: false
      properties:
        id: { type: integer, minimum: 1 }
        type: { type: string, minLength: 1, maxLength: 64 }
        generationId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/DesignGenerationStatus' }
        imageIndex: { type: [integer, 'null'], minimum: 1, maximum: 8 }
        proposalId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        timestamp: { type: string, format: date-time }
    DesignProposal:
      description: A generated bitmap for human review; never a template and never a brand asset.
      type: object
      required:
        [id, generationId, mode, name, contentType, format, width, height, mime, status, model, quality, parentProposalId, references, decisionNote, decidedAt, createdAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        generationId: { $ref: '#/components/schemas/Uuid' }
        mode: { $ref: '#/components/schemas/DesignMode' }
        name: { type: string, minLength: 1, maxLength: 120 }
        contentType: { $ref: '#/components/schemas/DesignContentType' }
        format: { $ref: '#/components/schemas/DesignFormat' }
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
        mime: { type: string, enum: [image/png, image/jpeg] }
        status: { $ref: '#/components/schemas/DesignProposalStatus' }
        model: { type: string, minLength: 1, maxLength: 100, pattern: '^[a-z0-9][a-z0-9._-]{0,99}$' }
        quality: { type: string, minLength: 2, maxLength: 16, pattern: '^[a-z]{2,16}$' }
        parentProposalId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        references:
          type: array
          maxItems: 9
          items: { $ref: '#/components/schemas/DesignReference' }
        decisionNote: { oneOf: [{ type: string, minLength: 1, maxLength: 1200, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
        decidedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
    DesignProposalDetail:
      type: object
      required: [proposal, generation, usage, cost, decisions, variantIds, layers, hasBackground]
      additionalProperties: false
      properties:
        proposal: { $ref: '#/components/schemas/DesignProposal' }
        generation:
          type: object
          required: [id, mode, style, instructions, inheritedInstructions, requestSize, adaptation, prompt, promptVersion, estimate, requestedCount, createdAt]
          additionalProperties: false
          properties:
            id: { $ref: '#/components/schemas/Uuid' }
            mode: { $ref: '#/components/schemas/DesignMode' }
            style: { oneOf: [{ type: string, minLength: 1, maxLength: 300, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
            instructions: { oneOf: [{ type: string, minLength: 1, maxLength: 12000, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
            inheritedInstructions: { oneOf: [{ type: string, minLength: 1, maxLength: 12000, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
            requestSize: { type: string, minLength: 5, maxLength: 9, pattern: '^[1-9][0-9]{1,3}x[1-9][0-9]{1,3}$' }
            adaptation: { type: string, enum: [none, center_crop] }
            prompt: { type: string, minLength: 1, maxLength: 32000 }
            promptVersion: { type: string, minLength: 1, maxLength: 64 }
            estimate: { $ref: '#/components/schemas/DesignCostEstimate' }
            requestedCount: { type: integer, minimum: 1, maximum: 8 }
            createdAt: { type: string, format: date-time }
        usage:
          oneOf:
            - type: object
              required: [inputTextTokens, inputImageTokens, outputImageTokens, outputTextTokens, totalTokens]
              additionalProperties: false
              properties:
                inputTextTokens: { type: [integer, 'null'], minimum: 0 }
                inputImageTokens: { type: [integer, 'null'], minimum: 0 }
                outputImageTokens: { type: [integer, 'null'], minimum: 0 }
                outputTextTokens: { type: [integer, 'null'], minimum: 0 }
                totalTokens: { type: [integer, 'null'], minimum: 0 }
            - type: 'null'
        cost: { type: [number, 'null'], minimum: 0, maximum: 100000 }
        decisions:
          type: array
          maxItems: 200
          items:
            type: object
            required: [decision, note, decidedAt]
            additionalProperties: false
            properties:
              decision: { type: string, enum: [approved, rejected, changes_requested] }
              note: { oneOf: [{ type: string, minLength: 1, maxLength: 1200, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
              decidedAt: { type: string, format: date-time }
        variantIds:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Uuid' }
        layers:
          description: Original brand assets drawn unchanged over the generated background, with their pixel boxes.
          type: array
          maxItems: 3
          items:
            type: object
            required: [assetId, label, kind, x, y, width, height]
            additionalProperties: false
            properties:
              assetId: { $ref: '#/components/schemas/Uuid' }
              label: { $ref: '#/components/schemas/Label' }
              kind: { $ref: '#/components/schemas/BrandAssetKind' }
              x: { type: integer, minimum: 0, maximum: 4096 }
              y: { type: integer, minimum: 0, maximum: 4096 }
              width: { type: integer, minimum: 1, maximum: 4096 }
              height: { type: integer, minimum: 1, maximum: 4096 }
        hasBackground: { type: boolean }
    VisualTemplateStatus:
      description: Status of a visual template (PD-ARCH-01G-C); archived templates are read only.
      type: string
      enum: [draft, published, archived]
    VisualTemplateVersionStatus:
      description: A published version is immutable.
      type: string
      enum: [draft, published]
    VisualTemplateBinding:
      description: |
        A sports-data field of the closed catalogue. Values come from the local Competiciones data (effective values,
        protected overrides included) and are never invented; there is no venue and no team badge (PD-03).
      type: string
      enum: ['competition.name', 'season.label', 'stage.name', 'round.name', 'match.homeTeam.name', 'match.awayTeam.name', 'match.kickoffDate', 'match.kickoffTime', 'match.status', 'match.score', 'match.homeScore', 'match.awayScore', 'round.fixtures']
    VisualTemplateTextEffect:
      description: |
        The closed palette of text effects (decision 01G-C-2), drawn by the slide engine in the palette colours and
        scaled with the font size: none, a soft or strong shadow, a gold or purple glow, a dark outline, or the gold
        scoreboard outline. No free CSS is accepted.
      type: string
      enum: [none, soft_shadow, strong_shadow, glow_gold, glow_purple, outline_dark, scoreboard_gold]
    VisualTemplateTextStyle:
      description: |
        Font role (its bundled family and weight), largest and smallest size in canvas pixels, most lines, palette colour
        role, alignment and overflow policy (shrink down to the smallest size, or fixed). Text is never cut. effect is a
        text effect (none when absent); uppercase draws the text in capital letters without changing the stored value
        (PD-29).
      type: object
      required: [fontRole, maxFontSize, minFontSize, maxLines, colorRole, align, verticalAlign, overflow]
      additionalProperties: false
      properties:
        fontRole: { type: string, enum: [heading, body, numeric] }
        maxFontSize: { type: integer, minimum: 8, maximum: 400 }
        minFontSize: { type: integer, minimum: 8, maximum: 400 }
        maxLines: { type: integer, minimum: 1, maximum: 12 }
        colorRole: { type: string, enum: [primary, primaryDark, accent, secondary, light] }
        align: { type: string, enum: [left, center, right] }
        verticalAlign: { type: string, enum: [top, middle, bottom] }
        overflow: { type: string, enum: [shrink, fixed] }
        effect: { $ref: '#/components/schemas/VisualTemplateTextEffect' }
        uppercase: { type: boolean }
    VisualTemplateImageFit:
      description: contain and cover keep the aspect ratio (cover crops); fill stretches.
      type: string
      enum: [contain, cover, fill]
    VisualTemplateTextLayer:
      description: Fixed text of the template. Positions and sizes are fractions of the canvas.
      type: object
      required: [id, name, x, y, width, height, visible, type, text, style]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 40, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
        name: { $ref: '#/components/schemas/Label' }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, minimum: 0, maximum: 1 }
        height: { type: number, minimum: 0, maximum: 1 }
        visible: { type: boolean }
        type: { type: string, const: text }
        text: { type: string, minLength: 1, maxLength: 500, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }
        style: { $ref: '#/components/schemas/VisualTemplateTextStyle' }
    VisualTemplateSportsDataLayer:
      description: Text bound to a catalogue field; the binding is null only in a draft.
      type: object
      required: [id, name, x, y, width, height, visible, type, binding, required, style]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 40, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
        name: { $ref: '#/components/schemas/Label' }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, minimum: 0, maximum: 1 }
        height: { type: number, minimum: 0, maximum: 1 }
        visible: { type: boolean }
        type: { type: string, const: sports_data }
        binding: { anyOf: [{ $ref: '#/components/schemas/VisualTemplateBinding' }, { type: 'null' }] }
        required: { type: boolean }
        style: { $ref: '#/components/schemas/VisualTemplateTextStyle' }
    VisualTemplateImageLayer:
      description: A graphic element or background of Mi marca (never a style reference, never a URL).
      type: object
      required: [id, name, x, y, width, height, visible, type, assetId, fit]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 40, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
        name: { $ref: '#/components/schemas/Label' }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, minimum: 0, maximum: 1 }
        height: { type: number, minimum: 0, maximum: 1 }
        visible: { type: boolean }
        type: { type: string, const: image }
        assetId: { $ref: '#/components/schemas/Uuid' }
        fit: { $ref: '#/components/schemas/VisualTemplateImageFit' }
    VisualTemplateBrandAssetLayer:
      description: The official logo or the mascot, drawn from its original file and only scaled proportionally.
      type: object
      required: [id, name, x, y, width, height, visible, type, assetId]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 1, maxLength: 40, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
        name: { $ref: '#/components/schemas/Label' }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, minimum: 0, maximum: 1 }
        height: { type: number, minimum: 0, maximum: 1 }
        visible: { type: boolean }
        type: { type: string, const: brand_asset }
        assetId: { $ref: '#/components/schemas/Uuid' }
    VisualTemplateLayer:
      description: One layer; the stacking order is the order of the layer list, bottom first.
      oneOf:
        - { $ref: '#/components/schemas/VisualTemplateTextLayer' }
        - { $ref: '#/components/schemas/VisualTemplateSportsDataLayer' }
        - { $ref: '#/components/schemas/VisualTemplateImageLayer' }
        - { $ref: '#/components/schemas/VisualTemplateBrandAssetLayer' }
    VisualTemplateBackgroundSource:
      type: string
      enum: [design_proposal, brand_asset]
    VisualTemplateBackgroundInput:
      type: object
      required: [source, id]
      additionalProperties: false
      properties:
        source: { $ref: '#/components/schemas/VisualTemplateBackgroundSource' }
        id: { $ref: '#/components/schemas/Uuid' }
    VisualTemplateBackground:
      description: The background, pinned by its hash and drawn over the whole canvas (cover); no file is copied.
      type: object
      required: [source, id, label, sha256, mime, width, height]
      additionalProperties: false
      properties:
        source: { $ref: '#/components/schemas/VisualTemplateBackgroundSource' }
        id: { $ref: '#/components/schemas/Uuid' }
        label: { type: string, minLength: 1, maxLength: 120 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        mime: { type: string, enum: [image/png, image/jpeg] }
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
    VisualTemplateAssetRef:
      description: A brand asset placed by a version, pinned by its hash, with the policy it had when saved.
      type: object
      required: [assetId, label, kind, usagePolicy, official, sha256]
      additionalProperties: false
      properties:
        assetId: { $ref: '#/components/schemas/Uuid' }
        label: { $ref: '#/components/schemas/Label' }
        kind: { $ref: '#/components/schemas/BrandAssetKind' }
        usagePolicy: { $ref: '#/components/schemas/BrandAssetUsagePolicy' }
        official: { type: boolean }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    VisualTemplateIssueCode:
      type: string
      enum:
        - OUT_OF_CANVAS
        - TOO_SMALL
        - FONT_SIZE_INVALID
        - OVERLAP
        - PROTECTED_OVERLAP
        - BINDING_MISSING
        - BINDING_NOT_ALLOWED
        - REQUIRED_BINDING_MISSING
        - ASSET_MISSING
        - ASSET_INACTIVE
        - ASSET_DELETED
        - ASSET_NOT_ALLOWED
        - TEXT_TOO_LONG
        - TEXT_MAY_NOT_FIT
        - LOW_CONTRAST
        - HIDDEN_LAYER
        - NO_LAYERS
        - BACKGROUND_UNAVAILABLE
        - BACKGROUND_SOURCE_DELETED
        - BACKGROUND_ASPECT
        - BACKGROUND_REVIEW
        - BACKGROUND_OWN_PROMPT
        - BACKGROUND_GENERATED_BRAND
        - VALUE_MISSING
        - TEXT_OVERFLOW
    VisualTemplateIssue:
      description: An error blocks publication; a warning is for the operator to review and decide.
      type: object
      required: [code, severity, layerId, message]
      additionalProperties: false
      properties:
        code: { $ref: '#/components/schemas/VisualTemplateIssueCode' }
        severity: { type: string, enum: [error, warning] }
        layerId: { anyOf: [{ type: string, minLength: 1, maxLength: 40, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }, { type: 'null' }] }
        message: { type: string, minLength: 1, maxLength: 300 }
    VisualTemplateValidation:
      type: object
      required: [publishable, issues]
      additionalProperties: false
      properties:
        publishable: { type: boolean }
        issues:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/VisualTemplateIssue' }
    VisualTemplate:
      type: object
      required: [id, name, description, category, contentType, format, status, sourceProposalId, publishedVersion, draftVersionId, versionCount, createdAt, updatedAt, archivedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/Label' }
        description: { oneOf: [{ type: string, minLength: 1, maxLength: 500, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
        category: { anyOf: [{ $ref: '#/components/schemas/Label' }, { type: 'null' }] }
        contentType: { $ref: '#/components/schemas/DesignContentType' }
        format: { $ref: '#/components/schemas/DesignFormat' }
        status: { $ref: '#/components/schemas/VisualTemplateStatus' }
        sourceProposalId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        publishedVersion:
          description: The latest published version.
          oneOf:
            - type: object
              required: [id, version, publishedAt]
              additionalProperties: false
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                version: { type: integer, minimum: 1 }
                publishedAt: { type: string, format: date-time }
            - type: 'null'
        draftVersionId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        versionCount: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
    VisualTemplateVersionSummary:
      type: object
      required: [id, version, status, layerCount, createdAt, updatedAt, publishedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/VisualTemplateVersionStatus' }
        layerCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
    VisualTemplateDetail:
      type: object
      required: [template, versions]
      additionalProperties: false
      properties:
        template: { $ref: '#/components/schemas/VisualTemplate' }
        versions:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/VisualTemplateVersionSummary' }
    VisualTemplateVersion:
      type: object
      required: [id, templateId, version, status, revision, canvasWidth, canvasHeight, background, layers, bindings, assets, validation, createdAt, updatedAt, publishedAt]
      additionalProperties: false
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        templateId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/VisualTemplateVersionStatus' }
        revision:
          description: Increases with every save of the draft; a save or a publication names the revision it starts from.
          type: integer
          minimum: 1
        canvasWidth: { type: integer, minimum: 1, maximum: 4096 }
        canvasHeight: { type: integer, minimum: 1, maximum: 4096 }
        background: { $ref: '#/components/schemas/VisualTemplateBackground' }
        layers:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/VisualTemplateLayer' }
        bindings:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/VisualTemplateBinding' }
        assets:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/VisualTemplateAssetRef' }
        validation: { $ref: '#/components/schemas/VisualTemplateValidation' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
    VisualTemplateVersionRef:
      description: The version a project used (recorded on projects by PD-ARCH-01G-D).
      type: object
      required: [templateId, versionId, version]
      additionalProperties: false
      properties:
        templateId: { $ref: '#/components/schemas/Uuid' }
        versionId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
    VisualTemplateCreate:
      type: object
      required: [sourceProposalId, name]
      additionalProperties: false
      properties:
        sourceProposalId: { $ref: '#/components/schemas/Uuid' }
        name: { $ref: '#/components/schemas/Label' }
        description: { type: string, minLength: 1, maxLength: 500, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }
        category: { $ref: '#/components/schemas/Label' }
        contentType:
          description: |
            What the template is for; the proposal's content type when absent. The proposal is only the background, so a
            template of another content type may use it. It cannot change later.
          allOf:
            - $ref: '#/components/schemas/DesignContentType'
        acknowledgeWarnings:
          description: Required (true) for an own-prompt proposal, whose image may contain generated text, people or brand elements.
          type: boolean
    VisualTemplateUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/Label' }
        description: { oneOf: [{ type: string, minLength: 1, maxLength: 500, pattern: '^(?:[^\p{Cc}\p{Cf}]|\n)+$' }, { type: 'null' }] }
        category: { anyOf: [{ $ref: '#/components/schemas/Label' }, { type: 'null' }] }
    VisualTemplateVersionSave:
      type: object
      required: [revision, background, layers]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1 }
        background: { $ref: '#/components/schemas/VisualTemplateBackgroundInput' }
        layers:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/VisualTemplateLayer' }
    VisualTemplateVersionCreate:
      type: object
      additionalProperties: false
      properties:
        fromVersionId: { $ref: '#/components/schemas/Uuid' }
    VisualTemplatePublish:
      type: object
      required: [revision]
      additionalProperties: false
      properties:
        revision: { type: integer, minimum: 1 }
    VisualTemplatePreviewSelection:
      description: Local sports data; a match for match content types, a round for a round calendar.
      type: object
      required: [competitionId, seasonId]
      additionalProperties: false
      properties:
        competitionId: { $ref: '#/components/schemas/Uuid' }
        seasonId: { $ref: '#/components/schemas/Uuid' }
        roundId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        matchId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
    VisualTemplatePreviewRequest:
      type: object
      required: [selection]
      additionalProperties: false
      properties:
        selection: { $ref: '#/components/schemas/VisualTemplatePreviewSelection' }
        language: { $ref: '#/components/schemas/Language' }
    VisualTemplatePreview:
      type: object
      required: [values, issues, imageUrl, width, height]
      additionalProperties: false
      properties:
        values:
          type: array
          maxItems: 40
          items:
            type: object
            required: [binding, value]
            additionalProperties: false
            properties:
              binding: { $ref: '#/components/schemas/VisualTemplateBinding' }
              value: { anyOf: [{ type: string, maxLength: 4000 }, { type: 'null' }] }
        issues:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/VisualTemplateIssue' }
        imageUrl: { type: string, maxLength: 400, pattern: '^/api/v1/visual-templates/' }
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
